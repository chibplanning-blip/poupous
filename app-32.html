<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- POUPOUS_APP  POUPOUS_VERSION=131 -->
<title>Poupous</title>
<style>
:root{--ink:#070d1a;--panel:#0e1729;--line:#1c2a44;--text:#e6edf7;--muted:#7d8ba3;--cyan:#38d6f5;--amber:#ffb547;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 12px);box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;letter-spacing:.2em;font-size:18px}
.status{color:var(--muted);font-size:13px;margin-top:2px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;flex:none}
.orb-wrap{position:relative;height:clamp(170px,32vh,270px);flex:none}
#orb{width:100%;height:100%;display:block}
.live{position:absolute;left:0;right:0;bottom:4px;text-align:center;color:var(--cyan);font-size:15px;min-height:22px;padding:0 8px}
.log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:6px 2px 12px;overscroll-behavior:contain}
.msg{max-width:88%}
.msg .who{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.msg p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.toi{align-self:flex-end;text-align:right}
.msg.toi p{background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:18px 18px 4px 18px;text-align:left}
.msg.poupous .who{color:var(--cyan)}
.msg.sys{align-self:center;color:var(--muted);font-size:13px;text-align:center;max-width:95%}
.bar{display:flex;gap:10px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.bar input{flex:1;min-width:0;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 18px;font:inherit}
.mic{width:64px;height:64px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#8ff3ff,var(--cyan) 45%,#1289a8);color:#04202a;display:grid;place-items:center;flex:none;box-shadow:0 0 0 6px rgba(56,214,245,.12)}
.mic.on{background:radial-gradient(circle at 35% 30%,#ffe0ad,var(--amber) 50%,#c77a12);box-shadow:0 0 0 9px rgba(255,181,71,.2)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.sheet{position:fixed;inset:0;background:rgba(3,6,14,.78);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet-inner{background:var(--panel);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 24px);box-sizing:border-box;border-top:1px solid var(--line)}
.sheet h2{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin:22px 0 4px}
.row,.chip{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.chip{align-items:flex-start;font-size:15px}
.row label{flex:1}
.row select,.row input[type=range]{width:55%}
select{background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:10px;height:40px;padding:0 8px;font:inherit;max-width:60%}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--cyan)}
input[type=range]{accent-color:var(--cyan)}
.btn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;flex:none}
.btn.primary{background:var(--cyan);color:#04202a;border-color:var(--cyan);font-weight:700}
.hint{color:var(--muted);font-size:13px}
.keybox{display:flex;flex-direction:column;gap:12px}
.carte{position:relative;overflow:hidden;height:220px;border-radius:16px;border:1px solid var(--line);background:var(--ink);margin-top:10px}
.carte-in{position:absolute;width:768px;height:768px}
.pin{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--amber);border:2px solid #04202a;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.pin.moi{background:var(--cyan);width:16px;height:16px;margin:-8px 0 0 -8px}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item .txt{flex:1;font-size:16px}
.item.ok .txt{text-decoration:line-through;color:var(--muted)}
.mag{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.mag .km{color:var(--cyan);font-weight:700;white-space:nowrap}
.clip{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;flex:none}
.attach{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px}
.attach:empty{display:none}
.vidgen{max-width:100%;border-radius:16px;border:1px solid var(--line);display:block;margin-top:8px;background:#000}
.imggen{max-width:100%;border-radius:16px;border:1px solid var(--line);display:block;margin-top:8px}
.chipfile{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px;font-size:13px;max-width:100%}
.chipfile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.chipfile button{width:26px;height:26px;border-radius:50%;border:0;background:var(--line);color:var(--text)}
.keybox input{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--ink);color:var(--text);padding:0 14px;font:inherit}
body.ecole{--ink:#0c1a14;--panel:#12261c;--line:#24473a;--cyan:#ffd84d;--text:#f2f1e6;--muted:#9bb5a5}
body.ecole .brand::after{content:" · ÉCOLE";color:var(--cyan);font-size:12px;letter-spacing:.14em}
body.ecole .orb-wrap{height:clamp(80px,13vh,120px)}
.tableau:not([hidden]) ~ .log{flex:0 0 20%}
.tableau{position:relative;flex:1 1 0;min-height:0;overflow-y:auto;margin:6px 0 8px;padding:12px 14px 14px;background:#1d3d2e;border:5px solid #8a5a2b;border-radius:14px;color:#f4f1e8;font-family:"Segoe Print","Comic Sans MS","Chalkboard SE",cursive,system-ui;box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.tableau h3{margin:0 0 10px;font-size:19px;color:#ffd84d;font-weight:700;letter-spacing:.02em}
.tab-etape{display:flex;gap:10px;margin:0 0 14px;animation:tabIn .5s ease both}
.tab-num{flex:none;width:28px;height:28px;border-radius:50%;background:#ffd84d;color:#1d3d2e;font:700 15px/28px system-ui;text-align:center;margin-top:2px}
.tab-txt{flex:1;min-width:0;font-size:18px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
.tab-formule{margin-top:6px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.25);color:#ffd84d;font-size:22px;overflow-x:auto;white-space:pre}
.tab-svg{margin-top:8px;color:#f4f1e8}
.tab-svg svg{width:100%;height:auto;max-height:230px;display:block}
.tab-caret{display:inline-block;width:2px;height:1.05em;background:#ffd84d;margin-left:2px;vertical-align:text-bottom;animation:caret .7s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.tab-etape.nouvelle .tab-num{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.tab-actions .btn.primary{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,216,77,.22)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.bravo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:31;pointer-events:none;font:800 44px/1.1 "Segoe Print","Comic Sans MS",cursive,system-ui;color:#ffd84d;text-shadow:0 3px 0 #8a5a2b,0 0 24px rgba(255,216,77,.6);text-align:center;animation:bravo 2s ease both;max-width:90%}
@keyframes bravo{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}30%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.tab-etape,.tab-num,.tab-actions .btn.primary,.tab-caret,.bravo{animation:none!important}}
.tab-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:2px}
.tab-actions .btn{color:#f4f1e8;border-color:#6a8f7b;font-family:system-ui,sans-serif}
@keyframes tabIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const P = window.Poupous;
const CHAT_MODEL = 'claude-sonnet-5';
const UPGRADE_MODEL = 'claude-opus-5';
const DEFAUT = {cerveau:'gemini', vitesse:1.0, hauteur:1.0, voix:'', mainsLibres:false, moteurVocal:'gemini', personnalite:"Chaleureux, vif, avec un brin d'humour, comme JARVIS dans Iron Man, mais tu tutoies et tu restes simple."};
const S = {attachments:[], state:'chargement', turns:[], faits:[], reglages:Object.assign({}, DEFAUT), busy:false, speaking:false, lastOk:false, pendingUpgrade:null, pendingRollback:false, hfRunning:false, listening:false, stop:false};
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const clean = s => String(s).replace(/https?:\/\/\S+/g, '').replace(/[*_#`>|]/g, '').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}]/gu, '').replace(/[ \t]+/g, ' ').trim();
const STATES = {
  chargement:['#38d6f5','Démarrage…'],
  veille:['#38d6f5','Appuie sur le micro ou écris-moi'],
  ecoute:['#38d6f5',"Je t'écoute…"],
  mainslibres:['#2aa9c7','Mains libres · dis « Poupous »'],
  reflexion:['#9d8cff','Je réfléchis…'],
  parole:['#ffb547','Je parle…'],
  amelioration:['#4ee0a6','Je modifie mon code…'],
  attente:['#ffb547','J\u2019attends ta validation'],
  erreur:['#ff6b6b','Un souci est survenu']
};
const MIC = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const CAM = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const CLIP = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 11.5l-8.5 8.5a5 5 0 0 1-7-7L14 4.5a3.3 3.3 0 0 1 4.7 4.7L10.2 17.7a1.7 1.7 0 0 1-2.4-2.4L15.5 7.6"/></svg>';
const CART = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 10.2a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.5L20.5 7H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>';
const GEAR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>';

/* ---------- Pont avec l'appli Android ---------- */
let seq = 0;
const pend = {};
function waitFor(prefix, start){ return new Promise(res => { const id = prefix + (++seq); pend[id] = res; start(id); }); }
function settle(id, value){ const f = pend[id]; delete pend[id]; if (f) f(value); }
window.__claudeDone = (id, status, text) => settle(id, {status, text});
window.__ttsDone = id => settle(id, true);
window.__listenDone = (id, text, err) => settle(id, {text, err});
window.__listenPartial = t => { $('#live').textContent = t; };
window.__captureDone = (id, b64, err) => settle(id, {b64, err});
window.__listenReady = () => {};
window.__contactsDone = (id, json) => settle(id, json);
window.__posDone = (id, json) => settle(id, json);
window.__githubDone = (id, status, text) => settle(id, {status, text});
window.__httpDone = (id, status, text) => settle(id, {status, text});
window.__telechargeDone = (id, res) => settle(id, res);
window.__installDone = (id, result) => settle(id, result);
window.__sharedAvailable = () => loadShared();
const hasFiles = () => !!(P && typeof P.saveFile === 'function');
const hasVeille = () => !!(P && typeof P.veille === 'function');
const hasPhone = () => !!(P && typeof P.dial === 'function');
const NEED_APK = "Cette action demande une version plus récente de l\u2019application Poupous. Demande-la à Claude.";
const OLD_APK = "Cette action demande la nouvelle version de l'APK Poupous : installe-la depuis la page Releases du dépôt GitHub.";
window.__onBack = () => { if (S.confirmReject) { S.confirmReject(false); } else if (!$('#sheet').hidden) { $('#sheet').hidden = true; } else if (S.speaking) { stopSpeaking(); } else if (P) { P.quit(); } };
const store = {
  get(k, d){ try { const v = P ? P.get(k) : ''; return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v){ try { if (P) P.set(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- Interface ---------- */
$('#app').innerHTML =
  '<header><div><div class="brand">POUPOUS</div><div class="status" id="status"></div></div>' +
  '<div style="display:flex;gap:10px"><button class="icon-btn" id="open-courses" aria-label="Courses">' + CART + '</button>' +
  '<button class="icon-btn" id="open-settings" aria-label="Réglages">' + GEAR + '</button></div></header>' +
  '<div class="orb-wrap"><canvas id="orb" aria-hidden="true"></canvas><div class="live" id="live"></div></div>' +
  '<canvas id="confetti" aria-hidden="true"></canvas>' +
'<div class="tableau" id="tableau" hidden></div>' +
'<div class="log" id="log" aria-live="polite"></div>' +
  '<div class="attach" id="attach"></div>' +
  '<div class="bar"><button class="clip" id="clip" aria-label="Joindre un fichier">' + CLIP + '</button><input type="file" id="fichier" multiple hidden><button class="clip" id="cam" aria-label="Prendre une photo">' + CAM + '</button><input type="file" id="photo" accept="image/*" capture="environment" hidden><input type="file" id="video" accept="video/*" capture="environment" hidden>' +
  '<input id="texte" placeholder="Écris à Poupous…" autocomplete="off" enterkeyhint="send" aria-label="Message">' +
  '<button class="mic" id="mic" aria-label="Parler à Poupous">' + MIC + '</button></div>' +
  '<div class="sheet" id="sheet" hidden><div class="sheet-inner" id="sheet-inner" role="dialog"></div></div>';

function setState(s){ S.state = s; $('#status').textContent = STATES[s][1]; }
function idle(){ try { majTheme(); } catch (e) {} setState(S.reglages.mainsLibres ? 'mainslibres' : 'veille'); }
function scrollLog(){ const l = $('#log'); l.scrollTop = l.scrollHeight; }
function addMsg(who, text){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  if (who !== 'sys') { const w = document.createElement('div'); w.className = 'who'; w.textContent = who === 'toi' ? 'Toi' : 'Poupous'; d.appendChild(w); }
  const p = document.createElement('p'); p.textContent = text; d.appendChild(p);
  $('#log').appendChild(d); scrollLog();
  return p;
}
const sys = t => addMsg('sys', t);

/* ---------- Orbe animée ---------- */
const cv = $('#orb'), g2 = cv.getContext('2d');
let t = 0;
function rgba(h, a){ const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
function draw(){
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  g2.setTransform(dpr, 0, 0, dpr, 0, 0); g2.clearRect(0, 0, w, h);
  const col = STATES[S.state][0];
  const sp = {parole:3.2, ecoute:2, reflexion:1.4, amelioration:1.6, mainslibres:.7, veille:.6, chargement:1, erreur:.4}[S.state] || 1;
  t += 0.016 * sp;
  const X = w / 2, Y = h / 2 - 10, R = Math.min(w, h) * .2, p = (Math.sin(t * 3) + 1) / 2, TAU = Math.PI * 2;
  const glow = g2.createRadialGradient(X, Y, R * .2, X, Y, R * 2.6); glow.addColorStop(0, rgba(col, .32)); glow.addColorStop(1, rgba(col, 0));
  g2.fillStyle = glow; g2.beginPath(); g2.arc(X, Y, R * 2.6, 0, TAU); g2.fill();
  for (let i = 1; i <= 3; i++) { g2.strokeStyle = rgba(col, .38 / i); g2.lineWidth = 1.5; g2.beginPath(); g2.arc(X, Y, R * (1.25 + i * .3) + p * 3 * i, 0, TAU); g2.stroke(); }
  if (S.state === 'reflexion' || S.state === 'amelioration' || S.state === 'chargement') {
    g2.strokeStyle = col; g2.lineWidth = 3; g2.lineCap = 'round';
    for (let k = 0; k < 3; k++) { const a = t * 2.2 + k * TAU / 3; g2.beginPath(); g2.arc(X, Y, R * 1.6, a, a + .8); g2.stroke(); }
  }
  g2.beginPath();
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    const amp = S.state === 'parole' ? R * .09 * Math.sin(a * 6 + t * 9) * (.6 + .4 * Math.sin(t * 5)) : S.state === 'ecoute' ? R * .05 * Math.sin(a * 4 + t * 6) : 0;
    const r = R + p * 3 + amp, px = X + Math.cos(a) * r, py = Y + Math.sin(a) * r;
    if (i) g2.lineTo(px, py); else g2.moveTo(px, py);
  }
  g2.closePath();
  const core = g2.createRadialGradient(X - R * .3, Y - R * .35, R * .08, X, Y, R * 1.05);
  core.addColorStop(0, '#ffffff'); core.addColorStop(.28, col); core.addColorStop(1, rgba(col, .2));
  g2.fillStyle = core; g2.fill();
  requestAnimationFrame(draw);
}

/* ---------- Voix ---------- */
function voicesFr(){ try { return P ? JSON.parse(P.voices()) : []; } catch (e) { return []; } }
function applyVoice(){ if (P) P.setVoice(+S.reglages.vitesse || 1, +S.reglages.hauteur || 1, S.reglages.voix || ''); }
async function speak(text){
  const c = clean(text);
  if (!c || !P) return;
  S.speaking = true; setState('parole');
  await waitFor('t', id => P.speak(id, c));
  S.speaking = false;
}
function stopSpeaking(){ if (P) P.stopSpeaking(); }

/* ---------- Famille : ordinateur de la maison (cerveau + mémoire commune) ---------- */
const famille = () => store.get('famille', null);
const svc = () => (famille() && famille().services) || {};
const hasFamille = () => !!(P && typeof P.http === 'function' && famille() && famille().u && famille().t);
function decoderCode(code){
  try {
    let b = String(code).trim().replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    const j = JSON.parse(utf8b64(b));
    if (j && /^https:\/\//.test(j.u) && j.t && j.t.length >= 16) return {u:String(j.u).replace(/\/+$/, ''), t:String(j.t)};
  } catch (e) {}
  return null;
}
async function serveur(methode, chemin, corps){
  const f = famille();
  const r = await waitFor('h', id => P.http(id, methode, f.u + chemin, JSON.stringify({'X-Poupous-Token': f.t, 'Content-Type':'application/json'}), corps ? JSON.stringify(corps) : ''));
  let data = null; try { data = JSON.parse(r.text); } catch (e) {}
  return {status:r.status, data, text:r.text};
}
let syncPause = 0;
async function syncFaits(force){
  if (!hasFamille() || (!force && Date.now() < syncPause)) return;
  try {
    if (force) { const pg = await serveur('GET', '/ping'); if (pg.status === 200 && pg.data && pg.data.ok) { const f0 = famille(); store.set('famille', Object.assign({}, f0, {enfant:!!pg.data.enfant, classe:pg.data.classe || '', admin:!!pg.data.admin, services:pg.data.services || {}})); } }
    const r = await serveur('GET', '/memoire');
    if (r.status !== 200 || !r.data || !Array.isArray(r.data.faits)) { syncPause = Date.now() + 120000; return; }
    const moi = famille().nom || '';
    S.faits = r.data.faits.map(x => (!x.par || x.par === moi) ? x.t : x.t + ' (noté par ' + x.par + ')');
    store.set('memoire', S.faits);
    syncPause = Date.now() + 60000;
  } catch (e) { syncPause = Date.now() + 120000; }
}

function setReglage(nom, valeur){
  const r = S.reglages;
  if (nom === 'vitesse' || nom === 'hauteur') { const v = parseFloat(valeur.replace(',', '.')); if (!isFinite(v)) return 'nombre attendu'; r[nom] = Math.min(2, Math.max(.5, v)); applyVoice(); }
  else if (nom === 'voix') { const vs = voicesFr(); const v = vs.find(x => norm(x) === norm(valeur)) || vs.find(x => norm(x).includes(norm(valeur))); if (!v) return 'voix introuvable'; r.voix = v; applyVoice(); }
  else if (nom === 'personnalite') r.personnalite = valeur.slice(0, 600);
  else if (nom === 'mainsLibres') { r.mainsLibres = /^(true|oui|1|on|vrai)$/i.test(valeur.trim()); if (r.mainsLibres) setTimeout(handsFree, 0); else if (P && S.listening) P.cancelListening(); }
  else return 'réglage inconnu';
  store.set('reglages', r);
  return nom + ' = ' + r[nom];
}
async function callClaude(body){
  const r = hasFamille() ? await serveur('POST', '/claude', body) : await waitFor('c', id => P.claude(id, JSON.stringify(body)));
  let data = null; try { data = JSON.parse(r.text); } catch (e) {}
  if (r.status === 200 && data) return data;
  const err = new Error(data && data.error ? data.error.message : r.text);
  err.status = r.status; err.type = data && data.error ? data.error.type : 'network';
  throw err;
}

function toGeminiSchema(s){
  if (!s || typeof s !== 'object') return s;
  const o = {};
  for (const k in s) {
    if (k === 'type') o.type = String(s.type).toUpperCase();
    else if (k === 'properties') { o.properties = {}; for (const q in s.properties) o.properties[q] = toGeminiSchema(s.properties[q]); }
    else if (k === 'items') o.items = toGeminiSchema(s.items);
    else o[k] = s[k];
  }
  return o;
}

function geminiParts(content){
  const parts = [];
  if (typeof content === 'string') parts.push({text:content});
  else for (const b of content) {
    if (b.type === 'text') parts.push({text:b.text});
    else if ((b.type === 'image' || b.type === 'document' || b.type === 'audio' || b.type === 'video') && b.source) parts.push({inlineData:{mimeType:b.source.media_type, data:b.source.data}});
  }
  return parts;
}
async function askGemini(messages, onText){
  const contents = [];
  for (const m of messages) {
    const role = m.role === 'assistant' ? 'model' : 'user';
    const parts = geminiParts(m.content);
    if (!parts.length) continue;
    if (contents.length && contents[contents.length - 1].role === role) contents[contents.length - 1].parts.push(...parts);
    else contents.push({role, parts});
  }
  while (contents.length && contents[0].role !== 'user') contents.shift();
  let answer = '';
  for (let round = 0; round < 6; round++) {
    const data = await geminiCall({systemInstruction:{parts:[{text:systemPrompt()}]}, contents, tools:geminiTools(), generationConfig:{maxOutputTokens:8192}});
    const cand = (data.candidates || [])[0];
    if (!cand || !cand.content) break;
    const parts = cand.content.parts || [];
    const texts = parts.filter(x => x.text && !x.thought).map(x => x.text).join(' ').trim();
    if (texts) { answer = clean(texts); onText(answer); }
    const calls = parts.filter(x => x.functionCall);
    if (!calls.length) break;
    contents.push({role:'model', parts});
    const responses = [];
    for (const c of calls) responses.push({functionResponse:{name:c.functionCall.name, response:{resultat:String(await runTool(c.functionCall.name, c.functionCall.args || {}))}}});
    contents.push({role:'user', parts:responses});
  }
  return answer;
}
async function complete(system, user, maxTokens){
  if (provider() === 'autre') {
    const d = await oaCall({messages:[{role:'system', content:system}, {role:'user', content:user}]});
    const ch = (d.choices || [])[0] || {};
    return {text:(ch.message && typeof ch.message.content === 'string') ? ch.message.content : '', truncated: ch.finish_reason === 'length'};
  }
  if (provider() === 'gemini') {
    const data = await geminiCall({systemInstruction:{parts:[{text:system}]}, contents:[{role:'user', parts:[{text:user}]}], generationConfig:{maxOutputTokens:65536}});
    const c = (data.candidates || [])[0] || {};
    const text = ((c.content && c.content.parts) || []).filter(x => x.text && !x.thought).map(x => x.text).join('');
    return {text, truncated: c.finishReason === 'MAX_TOKENS'};
  }
  const data = await callClaude({model:UPGRADE_MODEL, max_tokens:maxTokens, system, messages:[{role:'user', content:user}]});
  return {text:(data.content || []).filter(b => b.type === 'text').map(b => b.text).join(''), truncated: data.stop_reason === 'max_tokens'};
}

  else if (j.Definition) morceaux.push(j.Definition);

  const zone = "within_distance(geom, GEOM'POINT(" + lon + ' ' + lat + ")', " + rayon + 'km)';

  if (!r.ok) r = await fetch(base + '?where=' + encodeURIComponent(zone) + '&limit=100');

    return {prix:parseFloat(x[champ]), ville:x.ville || '', adr:x.adresse || '', km:(la != null && lo != null) ? distKm(lat, lon, la, lo) : null};

async function stationsOverpass(lat, lon, rayonM){

  const serveurs = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
  let derniere = 'aucun serveur ne répond';

    try {
      const r = await fetchAvecDelai(u, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'data=' + encodeURIComponent(q)}, 8000);
      if (!r.ok) { derniere = 'erreur ' + r.status; continue; }

        const la = e.lat != null ? e.lat : (e.center && e.center.lat);
        const lo = e.lon != null ? e.lon : (e.center && e.center.lon);

async function stationsNominatim(lat, lon, rayonKm){

function coursesAjouter(txt){

function distKm(a, b, c, d){
  const R = 6371, r = x => x * Math.PI / 180;
  const dl = r(c - a), dn = r(d - b);
  const h = Math.sin(dl/2)*Math.sin(dl/2) + Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)*Math.sin(dn/2);
  return 2 * R * Math.asin(Math.sqrt(h));
}

function position(){

    return waitFor('p', id => P.position(id)).then(r => {

      if (!o || o.erreur || typeof o.lat !== 'number') throw new Error(o && o.erreur ? o.erreur : 'position introuvable');
      const v = {lat:o.lat, lon:o.lon, vit:o.vitesse};

      e => rej(new Error(e && e.code === 1 ? "l'application ne me donne pas encore la position GPS" : "position introuvable")),

}
async function geocode(q){

async function magasins(lat, lon, rayon){
  const f = '"shop"~"^(' + MAG.shop.join('|') + ')$"';
  const q = '[out:json][timeout:25];(node[' + f + '](around:' + rayon + ',' + lat + ',' + lon + ');way[' + f + '](around:' + rayon + ',' + lat + ',' + lon + '););out center 60;';
  const r = await fetch('https://overpass-api.de/api/interpreter', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'data=' + encodeURIComponent(q)});
  if (!r.ok) throw new Error('service des magasins indisponible (' + r.status + ')');
  const j = await r.json();
  return (j.elements || []).map(e => {
    const la = e.lat != null ? e.lat : (e.center && e.center.lat);
    const lo = e.lon != null ? e.lon : (e.center && e.center.lon);

function carteHTML(lat, lon, pts){
  const z = 14, n = Math.pow(2, z), W = 256;
  const xy = (la, lo) => {
    const r = la * Math.PI / 180;
    return {x:(lo + 180) / 360 * n, y:(1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n};
  };
  const c = xy(lat, lon), x0 = Math.floor(c.x), y0 = Math.floor(c.y);
  let h = '';
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
    h += '<img src="https://tile.openstreetmap.org/' + z + '/' + (x0 + dx) + '/' + (y0 + dy) + '.png" width="256" height="256" style="position:absolute;left:' + ((dx + 1) * W) + 'px;top:' + ((dy + 1) * W) + 'px" alt="">';
  const px = (la, lo) => { const q = xy(la, lo); return {l:(q.x - x0 + 1) * W, t:(q.y - y0 + 1) * W}; };
  const me = px(lat, lon);
  h += '<div class="pin moi" style="left:' + me.l.toFixed(0) + 'px;top:' + me.t.toFixed(0) + 'px"></div>';
  pts.slice(0, 12).forEach(p => { const q = px(p.lat, p.lon); h += '<div class="pin" style="left:' + q.l.toFixed(0) + 'px;top:' + q.t.toFixed(0) + 'px"></div>'; });
  return '<div class="carte"><div class="carte-in" style="left:calc(50% - ' + me.l.toFixed(0) + 'px);top:calc(50% - ' + me.t.toFixed(0) + 'px)">' + h + '</div></div>' +
    '<p class="hint">Carte © OpenStreetMap</p>';
}

  store.set('maj', {resume, vu:false});
  await speak("C'est prêt, je me recharge.");
  const r = P.saveApp(html);
  if (r !== 'ok') { store.set('maj', null); upgradeFail("L'enregistrement a échoué (" + r + ")."); }
}
async function rollback(){
  S.busy = true; setState('amelioration');
  await speak('Je reviens à ma version précédente.');
  store.set('maj', {resume:'Je suis revenu à ma version précédente.', vu:false});
  const r = P.restoreBackup();
  if (r !== 'ok') { store.set('maj', null); upgradeFail(r === 'none' ? "Je n'ai pas de version précédente." : "Le retour en arrière a échoué."); }
}
function announce(){
  if (P && P.wasRolledBack()) { const m = "Ma dernière amélioration m'empêchait de démarrer, alors je suis revenu à ma version précédente."; addMsg('poupous', m); store.set('maj', null); speak(m).then(() => { if (!S.busy) idle(); }); return; }
  const maj = store.get('maj', null);
  if (maj && !maj.vu && maj.resume) {
    store.set('maj', {resume:maj.resume, vu:true});
    const m = maj.resume.startsWith('Je suis revenu') ? maj.resume : 'Mise à jour installée. ' + maj.resume;
    addMsg('poupous', m); speak(m).then(() => { if (!S.busy) idle(); });
  }
}

/* ---------- Démarrage ---------- */
$('#mic').onclick = micTap;
$('#clip').onclick = () => $('#fichier').click();
$('#cam').onclick = () => {
  $('#sheet-inner').innerHTML = '<div class="keybox"><span class="brand" style="font-size:14px">APPAREIL PHOTO</span>' +
    '<p class="hint">Vidéo courte : 12 secondes maximum, pour rester légère.</p>' +

  $('#sheet').hidden = false;
  $('#cam-photo').onclick = () => { $('#sheet').hidden = true; $('#photo').click(); };
  $('#cam-video').onclick = () => { $('#sheet').hidden = true; $('#video').click(); };
  $('#cam-annuler').onclick = () => { $('#sheet').hidden = true; };
};
$('#photo').onchange = e => $('#fichier').onchange(e);
$('#video').onchange = e => $('#fichier').onchange(e);
$('#fichier').onchange = e => {
  for (const f of Array.from(e.target.files || [])) {
    const maxi = typeMedia({nom:f.name, type:f.type || ''}) ? 14 : 10;
    if (f.size > maxi * 1024 * 1024) { sys('« ' + f.name + ' » est trop gros (' + maxi + ' Mo maximum).'); continue; }
    const rd = new FileReader();
    rd.onload = () => { const s = String(rd.result); addAttachment(f.name, f.type, s.slice(s.indexOf(',') + 1)); };
    rd.readAsDataURL(f);
  }
  e.target.value = '';
};
$('#texte').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = e.target.value.trim() || (S.attachments.length ? 'Voici un fichier.' : ''); if (v && !S.busy) { e.target.value = ''; e.target.blur(); stopSpeaking(); ask(v).then(() => { if (!S.busy) idle(); }); } } });
$('#open-settings').onclick = () => { renderSettings(); $('#sheet').hidden = false; };
$('#open-courses').onclick = () => { renderCourses(); $('#sheet').hidden = false; };
$('#sheet').onclick = e => { if (e.target.id !== 'sheet') return; if (S.confirmReject) { S.confirmReject(false); return; } $('#sheet').hidden = true; };
setState('chargement');
requestAnimationFrame(draw);
window.__poupousOK = true;

S.faits = store.get('memoire', []);
store.set('routeActive', false);
setTimeout(majRoute, 1500);
Object.assign(S.reglages, store.get('reglages', {}));
S.turns = store.get('conversation', []);
setTimeout(applyVoice, 800);
if (!P) { sys("Ouvre-moi depuis l'appli Poupous sur Android."); }
if (S.turns.length) { sys('Suite de notre conversation'); S.turns.slice(-6).forEach(x => addMsg(x.role === 'user' ? 'toi' : 'poupous', x.content)); }
else addMsg('poupous', "Salut ! Appuie sur le micro et parle-moi, ou \u00e9cris en bas. Tu peux aussi me demander de m'am\u00e9liorer.");
idle();
if (P && !brainReady()) openBrainKey(); else announce();
if (S.reglages.mainsLibres) handsFree();
loadShared();
if (hasFamille()) syncFaits(true).then(majTheme);
majTheme();
})();
