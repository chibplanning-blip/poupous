/* ---------- Pont avec l'appli Android ---------- */
let seq = 0;
const pend = {};
function waitFor(prefix, start){ return new Promise(res => { const id = prefix + (++seq); pend[id] = res; start(id); }); }
function settle(id, value){ const f = pend[id]; delete pend[id]; if (f) f(value); }

};

/* ---------- Position GPS ---------- */
function getLocation(){
  if (!hasLocation()) return Promise.resolve({err:'indisponible'});
  return new Promise(res => {
    navigator.geolocation.getCurrentPosition(
      pos => res({lat:pos.coords.latitude, lon:pos.coords.longitude, precision:Math.round(pos.coords.accuracy || 0)}),
      err => res({err: err.code === 1 ? 'refuse' : err.code === 2 ? 'indisponible' : 'delai'}),
      {enableHighAccuracy:true, timeout:15000, maximumAge:60000}
    );
  });
}
async function reverseGeocode(lat, lon){
  if (!P || typeof P.github !== 'function') return null;
  try {
    const url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lon + '&accept-language=fr&zoom=16';
    const r = await waitFor('g', id => P.github(id, 'GET', url, ''));
    const data = JSON.parse(r.text);
    return (data && data.display_name) ? data.display_name : null;
  } catch (e) { return null; }
}
function distanceMetres(lat1, lon1, lat2, lon2){
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

const DEFAULT_MARKET_DATA = {

function normalizeMarket(md){
  for (const k in md) {
    const m = md[k];
    if (!m || typeof m !== 'object') { delete md[k]; continue; }
    m.name = String(m.name || k);
    if (!Array.isArray(m.promos)) m.promos = [];
    if (!Array.isArray(m.list)) m.list = [];
    m.list = m.list.map(x => typeof x === 'string' ? {nom:x, coche:false} : {nom:String((x && x.nom) || ''), coche:!!(x && x.coche)}).filter(x => x.nom);

    // que si l'utilisateur a lui-même enregistré la position du magasin.
    if (!m.posEnregistree || typeof m.lat !== 'number' || typeof m.lon !== 'number') { m.lat = null; m.lon = null; m.posEnregistree = false; }
  }
  return md;
}
function getMarketData(){
  const saved = store.get('marketData', null);
  const md = normalizeMarket(saved || JSON.parse(JSON.stringify(DEFAULT_MARKET_DATA)));
  if (!saved) store.set('marketData', md);
  return md;
}
function saveMarketData(data){ store.set('marketData', data); if (typeof pushRadarConfig === 'function') pushRadarConfig(); }

/* Contrôle strict : ni viande, ni porc, ni alcool, ni dérivés animaux douteux. */
const INTERDITS = [
  'viande','poulet','dinde','canard','boeuf','bœuf','agneau','mouton','veau','porc','cochon','sanglier','lapin',
  'jambon','lard','bacon','saucisse','saucisson','merguez','chorizo','salami','charcuterie','pate de foie','foie gras','rillettes','nuggets',
  'gelatine','presure','saindoux','graisse animale',
  'alcool','vin','biere','rhum','vodka','whisky','champagne','cidre','liqueur'
];
const TOLERES = ['vegetal','vegetarien','vegan','soja','sans viande','sans alcool','sans porc','tofu','seitan','halal'];
function checkHalalCompliance(itemName){
  const n = norm(itemName);
  if (TOLERES.some(t => n.includes(t))) return {compliant:true, reason:"Version végétale ou certifiée : accepté"};
  for (const f of INTERDITS) {
    if (n.includes(norm(f))) {
      return {compliant:false, reason:"Refusé : « " + f + " » n'est pas conforme (règle stricte halal et sans viande). Précise « végétal », « sans viande » ou « halal » si c'est un substitut."};
    }
  }
  return {compliant:true, reason:"Conforme : halal et sans viande"};
}

    '</div>' +

    '</div>' +
    '<div class="market-content">' +
      '<div class="market-section-title">Repère de ' + esc(data.name) + '</div>' +
      '<div class="market-card">' +
        '<div class="market-item-row"><span class="hint" style="font-size:13px">' + esc(posTxt) + '</span>' +
        '<button class="mini-btn" id="save-store-pos">Je suis devant ce magasin</button></div>' +
      '</div>' +

        data.promos.map((p, i) => '<div class="market-item-row"><span>' + esc(p) + '</span><button class="mini-btn" data-del-promo="' + i + '">Retirer</button></div>').join('') + '</div>' : '') +
      '<div class="market-section-title">Liste de courses (halal stricte, sans viande)</div>' +
      '<div class="market-card" id="market-list-box">' +
        (data.list.length ? data.list.map((item, idx) =>
          '<div class="market-item-row ' + (item.coche ? 'done' : '') + '">' +
            '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;flex:1">' +

      '</div>' +
      '<div style="display:flex;gap:8px;margin-top:4px">' +
        '<input id="new-market-item" placeholder="Ajouter un article (contrôle strict)…" style="flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--text);padding:0 12px;font:inherit;font-size:14px">' +

/* ---------- Position GPS ---------- */
function getLocation(){
  if (!hasLocation()) return Promise.resolve({err:'indisponible'});
  return new Promise(res => {
    navigator.geolocation.getCurrentPosition(
      pos => res({lat:pos.coords.latitude, lon:pos.coords.longitude, precision:Math.round(pos.coords.accuracy || 0)}),
      err => res({err: err.code === 1 ? 'refuse' : err.code === 2 ? 'indisponible' : 'delai'}),
      {enableHighAccuracy:true, timeout:15000, maximumAge:60000}
    );
  });
}
async function reverseGeocode(lat, lon){
  if (!P || typeof P.github !== 'function') return null;
  try {
    const url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lon + '&accept-language=fr&zoom=16';
    const r = await waitFor('g', id => P.github(id, 'GET', url, ''));
    const data = JSON.parse(r.text);
    return (data && data.display_name) ? data.display_name : null;
  } catch (e) { return null; }
}
function distanceMetres(lat1, lon1, lat2, lon2){
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

}

const INTERDITS = [
  'viande','poulet','dinde','canard','boeuf','bœuf','agneau','mouton','veau','porc','cochon','sanglier','lapin',
  'jambon','lard','bacon','saucisse','saucisson','merguez','chorizo','salami','charcuterie','pate de foie','foie gras','rillettes','nuggets',
  'gelatine','presure','saindoux','graisse animale',
  'alcool','vin','biere','rhum','vodka','whisky','champagne','cidre','liqueur'
];
const TOLERES = ['vegetal','vegetarien','vegan','soja','sans viande','sans alcool','sans porc','tofu','seitan','halal'];
function checkHalalCompliance(itemName){
  const n = norm(itemName);
  if (TOLERES.some(t => n.includes(t))) return {compliant:true, reason:"Version végétale ou certifiée : accepté"};
  for (const f of INTERDITS) {
    if (n.includes(norm(f))) {
      return {compliant:false, reason:"Refusé : « " + f + " » n'est pas conforme (règle stricte halal et sans viande). Précise « végétal », « sans viande » ou « halal » si c'est un substitut."};
    }
  }
  return {compliant:true, reason:"Conforme : halal et sans viande"};
}

let seq = 0;
const pend = {};
function waitFor(prefix, start){ return new Promise(res => { const id = prefix + (++seq); pend[id] = res; start(id); }); }
function settle(id, value){ const f = pend[id]; delete pend[id]; if (f) f(value); }

/* ---------- Position GPS ---------- */
function getLocation(){
  if (!hasLocation()) return Promise.resolve({err:'indisponible'});
  return new Promise(res => {
    navigator.geolocation.getCurrentPosition(
      pos => res({lat:pos.coords.latitude, lon:pos.coords.longitude, precision:Math.round(pos.coords.accuracy || 0)}),
      err => res({err: err.code === 1 ? 'refuse' : err.code === 2 ? 'indisponible' : 'delai'}),
      {enableHighAccuracy:true, timeout:15000, maximumAge:60000}
    );
  });
}
async function reverseGeocode(lat, lon){
  if (!P || typeof P.github !== 'function') return null;
  try {
    const url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lon + '&accept-language=fr&zoom=16';
    const r = await waitFor('g', id => P.github(id, 'GET', url, ''));
    const data = JSON.parse(r.text);
    return (data && data.display_name) ? data.display_name : null;
  } catch (e) { return null; }
}
function distanceMetres(lat1, lon1, lat2, lon2){
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function normalizeMarket(md){
  for (const k in md) {
    const m = md[k];
    if (!m || typeof m !== 'object') { delete md[k]; continue; }
    m.name = String(m.name || k);
    if (!Array.isArray(m.promos)) m.promos = [];
    if (!Array.isArray(m.list)) m.list = [];
    m.list = m.list.map(x => typeof x === 'string' ? {nom:x, coche:false} : {nom:String((x && x.nom) || ''), coche:!!(x && x.coche)}).filter(x => x.nom);
    // Les anciennes versions contenaient des coordonnées d'exemple : on n'y touche
    // que si l'utilisateur a lui-même enregistré la position du magasin.
    if (!m.posEnregistree || typeof m.lat !== 'number' || typeof m.lon !== 'number') { m.lat = null; m.lon = null; m.posEnregistree = false; }
  }
  return md;
}

/* Contrôle strict : ni viande, ni porc, ni alcool, ni dérivés animaux douteux. */
const INTERDITS = [
  'viande','poulet','dinde','canard','boeuf','bœuf','agneau','mouton','veau','porc','cochon','sanglier','lapin',
  'jambon','lard','bacon','saucisse','saucisson','merguez','chorizo','salami','charcuterie','pate de foie','foie gras','rillettes','nuggets',
  'gelatine','presure','saindoux','graisse animale',
  'alcool','vin','biere','rhum','vodka','whisky','champagne','cidre','liqueur'
];
const TOLERES = ['vegetal','vegetarien','vegan','soja','sans viande','sans alcool','sans porc','tofu','seitan','halal'];
function checkHalalCompliance(itemName){
  const n = norm(itemName);
  if (TOLERES.some(t => n.includes(t))) return {compliant:true, reason:"Version végétale ou certifiée : accepté"};
  for (const f of INTERDITS) {
    if (n.includes(norm(f))) {
      return {compliant:false, reason:"Refusé : « " + f + " » n'est pas conforme (règle stricte halal et sans viande). Précise « végétal », « sans viande » ou « halal » si c'est un substitut."};
    }
  }
  return {compliant:true, reason:"Conforme : halal et sans viande"};
}

function gpsErrCopy(err){
  if (err === 'refuse') return "Accès à la position refusé. Autorise la localisation pour Poupous dans les réglages Android (Applis > Poupous > Autorisations > Position).";
  if (err === 'indisponible') return "Position indisponible : le GPS ne capte rien pour l'instant.";
  if (err === 'delai') return "Le GPS met trop de temps à répondre. Réessaie dehors ou près d'une fenêtre.";
  return "Souci GPS : " + err;
}

function checkStoreProximity(lat, lon){
  const md = getMarketData();
  const now = Date.now();
  if (now - S.lastProximityAlert < 600000) return;
  for (const key in md) {
    const st = md[key];
    if (!st.posEnregistree) continue;
    if (distanceMetres(lat, lon, st.lat, st.lon) > 500) continue;
    S.lastProximityAlert = now;
    const restants = st.list.filter(x => !x.coche).map(x => x.nom);
    const msg = restants.length
      ? "Tu es à moins de 500 mètres de " + st.name + ". Il te reste : " + restants.join(', ') + "."
      : "Tu es à moins de 500 mètres de " + st.name + ", mais ta liste est déjà complète.";
    sys('Radar 500 m : ' + st.name);
    addMsg('poupous', msg);
    if (!S.busy && !S.speaking) speak(msg).then(() => { if (!S.busy) idle(); });
    break;
  }
}

    : "Tu es à moins de 500 mètres de " + md[cle].name + ", mais ta liste est déjà complète.";

function toggleGpsTracking(){
  if (S.gpsTracking) {
    S.gpsTracking = false;
    store.set('radarActif', false);
    if (S.gpsWatchId !== null) { navigator.geolocation.clearWatch(S.gpsWatchId); S.gpsWatchId = null; }
    if (hasNativeRadar()) { try { P.stopRadar(); } catch (e) {} }
    sys('Radar de proximité arrêté.');
    return;
  }
  if (hasNativeRadar()) {
    const cfg = radarConfig();
    if (!cfg.magasins.length) { sys("Aucun magasin n'a de position enregistrée : va devant un magasin et touche « Je suis devant ce magasin »."); return; }
    S.gpsTracking = true;
    store.set('radarActif', true);
    let r = '';
    try { r = String(P.startRadar(JSON.stringify(cfg))); } catch (e) { r = 'erreur'; }
    if (r === 'permission') { sys("Autorise la position « Toujours » pour Poupous dans l'écran qui s'ouvre, puis relance le radar."); S.gpsTracking = false; store.set('radarActif', false); return; }
    if (r && r !== 'ok') { sys('Le service de radar refuse de démarrer (' + r + ').'); S.gpsTracking = false; store.set('radarActif', false); return; }
    sys('Radar 500 m lancé en arrière-plan : il continue même appli fermée et écran éteint.');
    return;
  }
  if (!hasLocation()) { sys("La géolocalisation n'est pas disponible sur ce téléphone."); return; }
  S.gpsTracking = true;
  store.set('radarActif', true);
  sys("Radar 500 m lancé, mais seulement tant que Poupous reste ouvert. Pour l'arrière-plan, demande « APK : radar magasins en arrière-plan ».");
  S.gpsWatchId = navigator.geolocation.watchPosition(
    pos => {
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      S.gpsDerniere = 'Lat ' + lat.toFixed(5) + ', Lon ' + lon.toFixed(5) + ' · ' + new Date().toLocaleTimeString('fr-FR');
      const box = $('#gps-coords');
      if (box) box.textContent = S.gpsDerniere;
      checkStoreProximity(lat, lon);
    },
    err => {
      const now = Date.now();
      if (now - S.lastGpsError < 120000) return;
      S.lastGpsError = now;
      const code = err.code === 1 ? 'refuse' : err.code === 2 ? 'indisponible' : 'delai';
      sys(gpsErrCopy(code));
      if (code === 'refuse') { S.gpsTracking = false; if (S.gpsWatchId !== null) { navigator.geolocation.clearWatch(S.gpsWatchId); S.gpsWatchId = null; } }
    },
    {enableHighAccuracy:true, maximumAge:10000, timeout:30000}
  );
}

/* ---------- Orbe animée ---------- */
const cv = $('#orb'), g2 = cv.getContext('2d');
let t = 0;
function rgba(h, a){ const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
function draw(){
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  g2.setTransform(dpr, 0, 0, dpr, 0, 0); g2.clearRect(0, 0, w, h);
  const col = STATES[S.state][0];
  const sp = {parole:3.2, ecoute:2, reflexion:1.4, amelioration:1.6, mainslibres:.7, veille:.6, chargement:1, erreur:.4}[S.state] || 1;
  t += 0.016 * sp;
  const X = w / 2, Y = h / 2 - 10, R = Math.min(w, h) * .2, p = (Math.sin(t * 3) + 1) / 2, TAU = Math.PI * 2;
  const glow = g2.createRadialGradient(X, Y, R * .2, X, Y, R * 2.6); glow.addColorStop(0, rgba(col, .32)); glow.addColorStop(1, rgba(col, 0));
  g2.fillStyle = glow; g2.beginPath(); g2.arc(X, Y, R * 2.6, 0, TAU); g2.fill();
  for (let i = 1; i <= 3; i++) { g2.strokeStyle = rgba(col, .38 / i); g2.lineWidth = 1.5; g2.beginPath(); g2.arc(X, Y, R * (1.25 + i * .3) + p * 3 * i, 0, TAU); g2.stroke(); }
  if (S.state === 'reflexion' || S.state === 'amelioration' || S.state === 'chargement') {
    g2.strokeStyle = col; g2.lineWidth = 3; g2.lineCap = 'round';

  }
  g2.beginPath();
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    const amp = S.state === 'parole' ? R * .09 * Math.sin(a * 6 + t * 9) * (.6 + .4 * Math.sin(t * 5)) : S.state === 'ecoute' ? R * .05 * Math.sin(a * 4 + t * 6) : 0;
    const r = R + p * 3 + amp, px = X + Math.cos(a) * r, py = Y + Math.sin(a) * r;
    if (i) g2.lineTo(px, py); else g2.moveTo(px, py);
  }

  const core = g2.createRadialGradient(X - R * .3, Y - R * .35, R * .08, X, Y, R * 1.05);
  core.addColorStop(0, '#ffffff'); core.addColorStop(.28, col); core.addColorStop(1, rgba(col, .2));
  g2.fillStyle = core; g2.fill();

}

async function listenOnce(){

function micError(err){
  if (err === 'not-allowed') sys("Je n'ai pas accès au micro. Autorise le micro pour Poupous dans les paramètres Android, puis réessaie.");
  else if (err === 'unsupported') sys("La reconnaissance vocale n'est pas disponible sur ce téléphone. Installe ou active l'appli Google, puis réessaie.");
  else if (err && err !== 'no-speech' && err !== 'aborted') sys("Je n'ai pas bien capté (" + err + "). Réessaie.");
}
function lev(a, b){
  const m = Array.from({length: b.length + 1}, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = m[0]; m[0] = i;
    for (let j = 1; j <= b.length; j++) { const tmp = m[j]; m[j] = Math.min(m[j] + 1, m[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = tmp; }
  }
  return m[b.length];
}
function findWake(text){
  const tok = text.trim().split(/\s+/), n = tok.map(x => norm(x).replace(/[^a-z]/g, ''));
  for (let i = n.length - 1; i >= 0; i--) {
    for (const span of [2, 1]) {
      if (i + span > n.length) continue;
      const c = n.slice(i, i + span).join('');
      if (c.length < 4 || c.length > 10) continue;
      if (1 - lev(c, 'poupous') / Math.max(c.length, 7) >= 0.7) return {rest: tok.slice(i + span).join(' ').replace(/^[,.!?;:\s]+/, '')};
    }
  }
  return null;
}
async function followUps(){
  while (S.lastOk && !S.pendingUpgrade && !S.pendingApkUpgrade && !S.pendingRollback) {
    setState('ecoute'); $('#mic').classList.add('on');
    const r = await listenOnce(); $('#mic').classList.remove('on');
    if (r.err && r.err !== 'no-speech' && r.err !== 'aborted') { micError(r.err); break; }
    if (!r.text) break;
    await ask(r.text);
  }
}
async function micTap(){
  if (S.speaking) { stopSpeaking(); return; }
  if (S.listening) { if (P) P.stopListening(); return; }
  if (S.busy) return;
  if (S.reglages.mainsLibres && S.hfRunning) return;
  setState('ecoute'); $('#mic').classList.add('on');
  const r = await listenOnce(); $('#mic').classList.remove('on');
  if (r.err && r.err !== 'no-speech' && r.err !== 'aborted') { micError(r.err); idle(); return; }
  if (!r.text) { idle(); return; }
  await ask(r.text);
  await followUps();
  if (!S.busy) idle();
}
async function handsFree(){
  if (S.hfRunning) return; S.hfRunning = true;
  while (S.reglages.mainsLibres) {
    if (S.busy || S.speaking || S.listening || !$('#sheet').hidden) { await sleep(400); continue; }
    setState('mainslibres');
    const r = await listenOnce();
    if (!S.reglages.mainsLibres) break;
    if (r.err === 'not-allowed' || r.err === 'unsupported') { micError(r.err); S.reglages.mainsLibres = false; store.set('reglages', S.reglages); break; }
    if (r.err && r.err !== 'no-speech' && r.err !== 'aborted') { await sleep(1500); continue; }
    if (!r.text) continue;
    const w = findWake(r.text); if (!w) continue;
    if (/\p{L}{2,}/u.test(w.rest)) await ask(w.rest);
    else { await speak('Oui ?'); setState('ecoute'); const q = await listenOnce(); if (q.text) await ask(q.text); }
    await followUps();
  }
  S.hfRunning = false;
  if (!S.busy) idle();
}

function geminiParts(content){
  const parts = [];
  if (typeof content === 'string') parts.push({text:content});
  else for (const b of content) {
    if (b.type === 'text') parts.push({text:b.text});
    else if ((b.type === 'image' || b.type === 'document') && b.source) parts.push({inlineData:{mimeType:b.source.media_type, data:b.source.data}});
  }
  return parts;
}
async function askGemini(messages, onText){
  const contents = [];
  for (const m of messages) {
    const role = m.role === 'assistant' ? 'model' : 'user';
    const parts = geminiParts(m.content);
    if (!parts.length) continue;
    if (contents.length && contents[contents.length - 1].role === role) contents[contents.length - 1].parts.push(...parts);
    else contents.push({role, parts});
  }
  while (contents.length && contents[0].role !== 'user') contents.shift();
  let answer = '';
  for (let round = 0; round < 6; round++) {
    const data = await geminiCall({systemInstruction:{parts:[{text:systemPrompt()}]}, contents, tools:geminiTools(), generationConfig:{maxOutputTokens:8192}});
    const cand = (data.candidates || [])[0];
    if (!cand || !cand.content) break;
    const parts = cand.content.parts || [];
    const texts = parts.filter(x => x.text && !x.thought).map(x => x.text).join(' ').trim();
    if (texts) { answer = clean(texts); onText(answer); }
    const calls = parts.filter(x => x.functionCall);
    if (!calls.length) break;
    contents.push({role:'model', parts});
    const responses = [];
    for (const c of calls) {
      const resVal = await runTool(c.functionCall.name, c.functionCall.args || {});
      responses.push({functionResponse:{name:c.functionCall.name, response:{resultat:String(resVal)}}});
    }
    contents.push({role:'user', parts:responses});
  }
  return answer;
}
async function complete(system, user, maxTokens){
  if (provider() === 'gemini') {
    const data = await geminiCall({systemInstruction:{parts:[{text:system}]}, contents:[{role:'user', parts:[{text:user}]}], generationConfig:{maxOutputTokens:65536}});
    const c = (data.candidates || [])[0] || {};
    const text = ((c.content && c.content.parts) || []).filter(x => x.text && !x.thought).map(x => x.text).join('');
    return {text, truncated: c.finishReason === 'MAX_TOKENS'};
  }
  const data = await callClaude({model:UPGRADE_MODEL, max_tokens:maxTokens, system, messages:[{role:'user', content:user}]});
  return {text:(data.content || []).filter(b => b.type === 'text').map(b => b.text).join(''), truncated: data.stop_reason === 'max_tokens'};
}
function b64utf8(s){ return btoa(unescape(encodeURIComponent(s))); }
function utf8b64(b){ try { return decodeURIComponent(escape(atob(b))); } catch (e) { return atob(b); } }
async function gh(method, path, body){
  const r = await waitFor('g', id => P.github(id, method, path, body ? JSON.stringify(body) : ''));
  let data = null; try { data = JSON.parse(r.text); } catch (e) {}
  return {status:r.status, data, text:r.text};
}
async function pushFile(path, contentB64, message){
  const repo = P.repo();
  const cur = await gh('GET', '/repos/' + repo + '/contents/' + encodeURI(path));
  const body = {message, content:contentB64};
  if (cur.status === 200 && cur.data && cur.data.sha) body.sha = cur.data.sha;
  const r = await gh('PUT', '/repos/' + repo + '/contents/' + encodeURI(path), body);
  if (r.status !== 200 && r.status !== 201) {
    const why = r.status === 401 ? 'jeton GitHub refusé' : r.status === 403 || r.status === 404 ? 'jeton GitHub sans accès en écriture au dépôt' : ((r.data && r.data.message) || r.text || '').slice(0, 160);
    throw new Error('GitHub ' + r.status + ' : ' + why);
  }
}
function attachmentBlocks(list){
  const blocks = [];
  for (const a of list) {
    if (/^image\/(jpeg|png|gif|webp)$/.test(a.type)) blocks.push({type:'image', source:{type:'base64', media_type:a.type, data:a.base64}});
    else if (a.type === 'application/pdf') blocks.push({type:'document', source:{type:'base64', media_type:'application/pdf', data:a.base64}});
    else if (/^text\/|json|xml|csv|javascript/.test(a.type) || /\.(txt|md|csv|json|html?|xml|js|py|java|kt|log)$/i.test(a.nom)) blocks.push({type:'text', text:'Fichier « ' + a.nom + ' » :\n' + utf8b64(a.base64).slice(0, 100000)});
    else blocks.push({type:'text', text:'(Fichier « ' + a.nom + ' » de type ' + a.type + ' reçu : je ne peux pas lire ce format.)'});
  }
  return blocks;
}
function renderAttachments(){
  const box = $('#attach'); box.innerHTML = '';
  S.attachments.forEach((a, i) => {
    const c = document.createElement('div'); c.className = 'chipfile';
    const s = document.createElement('span'); s.textContent = a.nom; c.appendChild(s);
    const b = document.createElement('button'); b.textContent = '×'; b.setAttribute('aria-label', 'Retirer ' + a.nom);
    b.onclick = () => { S.attachments.splice(i, 1); renderAttachments(); };

  });
}
function addAttachment(nom, type, base64){

  S.attachments.push({nom, type: type || 'application/octet-stream', base64}); renderAttachments();
}

function errCopy(e){
  if (e.gemini) {
    if (e.status === 400 && /api key|API_KEY/i.test(e.message || '')) return "Ma clé Gemini est refusée. Vérifie-la dans les réglages.";
    if (e.status === 403) return "Ma clé Gemini n'a pas accès à ce modèle. Vérifie-la dans les réglages.";
    if (e.status === 429) return "J'ai atteint la limite gratuite de Gemini. Réessaie dans une minute, ou demain si c'est la limite du jour.";
    if (e.status >= 500) return "Gemini est surchargé, redemande-moi dans un instant.";
    if (!e.status) return "Pas de connexion internet, je ne peux pas réfléchir.";
    return "J'ai eu un souci avec Gemini (" + e.status + ").";
  }
  if (e.status === 401) return "Ma clé API est refusée. Vérifie-la dans les réglages.";
  if (e.status === 402 || /credit|billing/i.test(e.message || '')) return "Il n'y a plus de crédit sur ta clé API. Recharge-la sur console.anthropic.com.";
  if (e.status === 429) return "Trop de demandes d'un coup. Attends un peu et redemande-moi.";
  if (e.status === 529 || e.status >= 500) return "Mon cerveau est surchargé, redemande-moi dans un instant.";
  if (!e.status) return "Pas de connexion internet, je ne peux pas réfléchir.";
  return "J'ai eu un souci en réfléchissant (" + e.status + ").";
}
async function ask(text){
  if (S.busy) return;
  const cmd = text.match(/^\s*(apk|page)\s*[:：]\s*([\s\S]{3,})$/i);
  if (cmd) {
    addMsg('toi', text);
    if (cmd[1].toLowerCase() === 'apk') {
      if (!hasSelfApk()) { sys(NEED_APK); return; }
      if (!P.hasGithub()) { sys("Il faut d'abord le jeton GitHub : roue → GitHub → Enregistrer."); return; }
      await runApkUpgrade(cmd[2].trim());
    } else {
      await runUpgrade(cmd[2].trim());
    }
    return;
  }
  S.busy = true; S.lastOk = false;
  addMsg('toi', text);
  if (!brainReady()) { const m = provider() === 'gemini' ? "Il me faut ta clé Gemini gratuite pour réfléchir." : "Il me faut ta clé API pour réfléchir."; addMsg('poupous', m); S.busy = false; idle(); openBrainKey(); return; }
  const joints = S.attachments.splice(0); renderAttachments();
  if (joints.length) sys('Fichiers joints : ' + joints.map(a => a.nom).join(', '));
  S.turns.push({role:'user', content: text + (joints.length ? '\n[Fichiers joints : ' + joints.map(a => a.nom).join(', ') + ']' : '')});
  setState('reflexion');
  const p = addMsg('poupous', '…');
  const messages = S.turns.slice(-20).map(x => ({role:x.role, content:x.content}));
  while (messages.length && messages[0].role !== 'user') messages.shift();
  if (joints.length) messages[messages.length - 1] = {role:'user', content: attachmentBlocks(joints).concat([{type:'text', text}])};
  let answer = '';
  try {
    if (provider() === 'gemini') {
      answer = await askGemini(messages, x => { p.textContent = x; scrollLog(); });
    } else for (let round = 0; round < 6; round++) {
      const data = await callClaude({model:CHAT_MODEL, max_tokens:1024, system:systemPrompt(), tools:toolDefs(), messages});
      const texts = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join(' ').trim();
      if (texts) { answer = clean(texts); p.textContent = answer; scrollLog(); }
      if (data.stop_reason !== 'tool_use') break;
      messages.push({role:'assistant', content:data.content});
      const results = [];
      for (const b of data.content) if (b.type === 'tool_use') {
        const resVal = await runTool(b.name, b.input || {});
        results.push({type:'tool_result', tool_use_id:b.id, content:String(resVal)});
      }
      messages.push({role:'user', content:results});
    }
    if (!answer) answer = "C'est fait.";
    p.textContent = answer; S.lastOk = true;
  } catch (e) {
    answer = errCopy(e); p.textContent = answer; S.turns.pop();
    if (e.gemini && e.message) sys('Détail Gemini (' + e.status + ') : ' + String(e.message).slice(0, 200));
  }
  if (S.lastOk) { S.turns.push({role:'assistant', content:answer}); S.turns = S.turns.slice(-20); store.set('conversation', S.turns); }
  await speak(answer);
  S.busy = false;
  if (S.pendingApkUpgrade) { const d = S.pendingApkUpgrade; S.pendingApkUpgrade = null; S.pendingUpgrade = null; await runApkUpgrade(d); }
  else if (S.pendingUpgrade) { const d = S.pendingUpgrade; S.pendingUpgrade = null; await runUpgrade(d); }
  else if (S.pendingRollback) { S.pendingRollback = false; rollback(); }
  else idle();
}

      const jobs = await gh('GET', '/repos/' + repo + '/actions/runs/' + run.id + '/jobs');
      const job = ((jobs.data && jobs.data.jobs) || [])[0];
      if (job) { const logs = await gh('GET', '/repos/' + repo + '/actions/jobs/' + job.id + '/logs'); lastLog = (logs.text || '').slice(-8000); }
    } catch (e) {}
    files = next;
    if (attempt === 2) return upgradeFail("La construction a encore échoué, je n'installe rien. Ta version actuelle reste intacte.");
  }
}
async function rollback(){
  S.busy = true; setState('amelioration');
  await speak('Je reviens à ma version précédente.');
  store.set('maj', {resume:'Je suis revenu à ma version précédente.', vu:false});
  const r = P.restoreBackup();
  if (r !== 'ok') { store.set('maj', null); upgradeFail(r === 'none' ? "Je n'ai pas de version précédente." : "Le retour en arrière a échoué."); }
}
function announce(){
  if (P && P.wasRolledBack()) { const m = "Ma dernière amélioration m'empêchait de démarrer, alors je suis revenu à ma version précédente."; addMsg('poupous', m); store.set('maj', null); speak(m).then(() => { if (!S.busy) idle(); }); return; }
  const maj = store.get('maj', null);
  if (maj && !maj.vu && maj.resume) {
    store.set('maj', {resume:maj.resume, vu:true});
    const m = maj.resume.startsWith('Je suis revenu') ? maj.resume : 'Mise à jour installée. ' + maj.resume;
    addMsg('poupous', m); speak(m).then(() => { if (!S.busy) idle(); });
  }
}

/* ---------- Clés et réglages ---------- */
function openKey(){
  $('#sheet-inner').innerHTML =
    '<div class="keybox"><span class="brand" style="font-size:14px">CLÉ API ANTHROPIC</span>' +
    '<p class="hint">Colle ta clé (elle commence par sk-ant-). Elle reste enregistrée uniquement sur ce téléphone.</p>' +
    '<input id="apikey" type="password" autocomplete="off" placeholder="sk-ant-…" aria-label="Clé API">' +
    '<div class="row" style="border:0"><button class="btn" id="key-cancel">Plus tard</button><button class="btn primary" id="key-save">Enregistrer</button></div></div>';
  $('#sheet').hidden = false;
  $('#key-cancel').onclick = () => { $('#sheet').hidden = true; };
  $('#key-save').onclick = () => {
    const k = $('#apikey').value.replace(/\s+/g, '');
    if (!/^sk-ant-/.test(k) && k.length >= 20) { store.set('geminiKey', k); store.set('geminiModel', ''); S.reglages.cerveau = 'gemini'; store.set('reglages', S.reglages); $('#sheet').hidden = true; sys('Clé Gemini enregistrée. Je suis prêt !'); return; }
    if (!/^sk-ant-/.test(k)) { $('#apikey').style.borderColor = '#ff6b6b'; return; }
    P.setKey(k); $('#sheet').hidden = true; sys('Clé enregistrée. Je suis prêt !');
  };
}
function openGeminiKey(){
  $('#sheet-inner').innerHTML =
    '<div class="keybox"><span class="brand" style="font-size:14px">CLÉ GEMINI (GRATUITE)</span>' +
    '<p class="hint">1. Ouvre aistudio.google.com/apikey dans Chrome, connecté à ton compte Google.<br>2. Touche « Create API key » et copie la clé (elle commence par AIza).<br>3. Colle-la ici. Elle reste enregistrée uniquement sur ce téléphone.</p>' +
    '<input id="gemkey" type="password" autocomplete="off" placeholder="AIza…" aria-label="Clé Gemini">' +
    '<div class="row" style="border:0"><button class="btn" id="gem-cancel">Plus tard</button><button class="btn primary" id="gem-save">Enregistrer</button></div></div>';
  $('#sheet').hidden = false;
  $('#gem-cancel').onclick = () => { $('#sheet').hidden = true; };
  $('#gem-save').onclick = () => {
    const k = $('#gemkey').value.replace(/\s+/g, '');
    if (k.length < 20) { $('#gemkey').style.borderColor = '#ff6b6b'; return; }
    store.set('geminiKey', k); store.set('geminiModel', ''); $('#sheet').hidden = true; sys('Clé Gemini enregistrée. Je suis prêt !');
  };
}
function renderSettings(){
  const r = S.reglages, vs = voicesFr();
  $('#sheet-inner').innerHTML =
    '<div class="row" style="padding-top:0"><span class="brand" style="font-size:14px">RÉGLAGES</span><button class="btn" id="close-settings">Fermer</button></div>' +
    '<h2>Écoute</h2>' +
    '<div class="row"><label for="hf">Mains libres<br><span class="hint">Écoute « Poupous » en continu tant que l\'appli est ouverte</span></label><input type="checkbox" id="hf"' + (r.mainsLibres ? ' checked' : '') + '></div>' +
    '<h2>Voix</h2>' +
    '<div class="row"><label for="voix">Voix</label><select id="voix"><option value="">Automatique</option>' + vs.map(v => '<option value="' + esc(v) + '"' + (v === r.voix ? ' selected' : '') + '>' + esc(v) + '</option>').join('') + '</select></div>' +
    '<div class="row"><label for="vitesse">Vitesse</label><input type="range" id="vitesse" min="0.5" max="2" step="0.05" value="' + r.vitesse + '"></div>' +
    '<div class="row"><label for="hauteur">Hauteur</label><input type="range" id="hauteur" min="0.5" max="2" step="0.05" value="' + r.hauteur + '"></div>' +
    '<div class="row"><span class="hint">Écoute le résultat</span><button class="btn" id="test-voix">Tester la voix</button></div>' +
    '<h2>Courses et radar</h2>' +
    '<div class="row"><span class="hint">Listes par magasin et radar 500 m</span><button class="btn" id="open-market-2">Ouvrir</button></div>' +
    '<h2>Ce que Poupous retient</h2>' +
    (S.faits.length ? S.faits.map((f, i) => '<div class="chip"><span>' + esc(f) + '</span><button class="btn" data-del="' + i + '">Oublier</button></div>').join('')
      : '<p class="hint">Rien pour l\'instant. Dis par exemple « retiens que je bois mon café noir ».</p>') +
    '<h2>Cerveau</h2>' +
    '<div class="row"><label for="cerveau">Modèle</label><select id="cerveau"><option value="gemini"' + (provider() === 'gemini' ? ' selected' : '') + '>Gemini (gratuit)</option><option value="claude"' + (provider() === 'claude' ? ' selected' : '') + '>Claude (payant)</option></select></div>' +
    '<div class="row"><span>Clé Gemini : ' + (geminiKey() ? 'enregistrée' : 'aucune') + '</span><button class="btn" id="change-gem">' + (geminiKey() ? 'Changer' : 'Ajouter') + '</button></div>' +
    '<div class="row"><span>Clé Claude : ' + (P && P.hasKey() ? 'enregistrée' : 'aucune') + '</span><button class="btn" id="change-key">' + (P && P.hasKey() ? 'Changer' : 'Ajouter') + '</button></div>' +
    (P && typeof P.setGithub === 'function' ?
      '<h2>GitHub</h2><p class="hint">Permet à Poupous de reconstruire et installer lui-même son application. Le jeton commence par github_pat_ et a besoin de Contents en lecture et écriture, Actions en lecture.</p>' +
      '<div class="keybox" style="padding-top:8px"><input id="ghkey-input" type="password" autocomplete="off" placeholder="github_pat_…" aria-label="Jeton d\'accès GitHub"><div class="row" style="border:0;padding:0"><span class="hint" id="gh-status-hint">' + (P.hasGithub() ? 'Jeton enregistré' : 'Aucun jeton') + '</span><button class="btn primary" id="save-gh-btn">Enregistrer le jeton</button></div></div>' : '') +
    '<h2>Améliorer Poupous</h2>' +
    '<p class="hint">Décris le changement voulu, puis choisis où l\'appliquer.</p>' +
    '<input id="amelio" style="width:100%;box-sizing:border-box;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--ink);color:var(--text);padding:0 14px;font:inherit" placeholder="Ex. : radar magasins même écran éteint">' +
    '<div class="row"><button class="btn" id="go-page">Modifier la page</button><button class="btn primary" id="go-apk">Modifier l\'APK</button></div>' +
    '<h2>Versions</h2>' +
    '<p class="hint">Page : version ' + (P ? P.appVersion() : '?') + ' · Application Android : ' + (P && typeof P.nativeVersion === 'function' ? '1.' + (P.nativeVersion() - 1) : '1.0') + '</p>' +
    '<div class="row"><span>Version précédente</span><button class="btn" id="undo">Restaurer</button></div>' +
    '<div class="row"><span>Historique de conversation</span><button class="btn" id="clear-conv">Effacer</button></div>';
  $('#close-settings').onclick = () => { $('#sheet').hidden = true; };
  $('#hf').onchange = e => { setReglage('mainsLibres', String(e.target.checked)); if (!S.busy) idle(); };
  $('#voix').onchange = e => { S.reglages.voix = e.target.value; applyVoice(); store.set('reglages', S.reglages); };
  $('#vitesse').onchange = e => setReglage('vitesse', e.target.value);
  $('#hauteur').onchange = e => setReglage('hauteur', e.target.value);
  $('#test-voix').onclick = () => speak("Salut, c'est Poupous. Voilà ma voix.").then(() => { if (!S.busy) idle(); });
  $('#open-market-2').onclick = () => openMarketSheet();
  $('#change-key').onclick = openKey;
  $('#change-gem').onclick = openGeminiKey;
  $('#go-page').onclick = () => { const d = $('#amelio').value.trim(); if (d.length < 3 || S.busy) return; $('#sheet').hidden = true; ask('PAGE: ' + d); };
  $('#go-apk').onclick = () => { const d = $('#amelio').value.trim(); if (d.length < 3 || S.busy) return; $('#sheet').hidden = true; ask('APK: ' + d); };
  $('#cerveau').onchange = e => { S.reglages.cerveau = e.target.value; store.set('reglages', S.reglages); renderSettings(); if (!brainReady()) openBrainKey(); };
  if ($('#save-gh-btn')) {
    $('#save-gh-btn').onclick = async () => {
      const k = $('#ghkey-input').value.trim();
      if (!/^(github_pat_|ghp_)/.test(k)) { $('#ghkey-input').style.borderColor = '#ff6b6b'; return; }
      P.setGithub(k);
      const r2 = await gh('GET', '/repos/' + P.repo());
      if (r2.status === 200 && r2.data && r2.data.permissions && r2.data.permissions.push) sys('Jeton GitHub enregistré : je peux maintenant me reconstruire moi-même.');
      else if (r2.status === 200) sys("Jeton enregistré, mais il n'a pas le droit d'écrire dans le dépôt. Donne-lui Contents en lecture et écriture.");
      else sys('Jeton enregistré, mais GitHub le refuse (' + r2.status + '). Vérifie qu\'il donne accès au dépôt ' + P.repo() + '.');
      renderSettings();
    };
  }
  $('#sheet-inner').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.faits.splice(+b.dataset.del, 1); store.set('memoire', S.faits); renderSettings(); });
  $('#undo').onclick = () => { $('#sheet').hidden = true; if (!S.busy) rollback(); };
  $('#clear-conv').onclick = () => { S.turns = []; store.set('conversation', []); $('#log').innerHTML = ''; sys('Historique effacé.'); };
}

/* ---------- Démarrage ---------- */
$('#mic').onclick = micTap;
$('#clip').onclick = () => $('#fichier').click();
$('#open-market').onclick = () => openMarketSheet();
$('#fichier').onchange = e => {
  for (const f of Array.from(e.target.files || [])) {
    if (f.size > 10 * 1024 * 1024) { sys('« ' + f.name + ' » est trop gros (10 Mo maximum).'); continue; }
    const rd = new FileReader();
    rd.onload = () => { const s = String(rd.result); addAttachment(f.name, f.type, s.slice(s.indexOf(',') + 1)); };
    rd.readAsDataURL(f);
  }
  e.target.value = '';
};
$('#texte').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = e.target.value.trim() || (S.attachments.length ? 'Voici un fichier.' : ''); if (v && !S.busy) { e.target.value = ''; e.target.blur(); stopSpeaking(); ask(v).then(() => { if (!S.busy) idle(); }); } } });
$('#open-settings').onclick = () => { renderSettings(); $('#sheet').hidden = false; };
$('#sheet').onclick = e => { if (e.target.id === 'sheet') $('#sheet').hidden = true; };
setState('chargement');
requestAnimationFrame(draw);
window.__poupousOK = true;

S.faits = store.get('memoire', []);
Object.assign(S.reglages, store.get('reglages', {}));
S.turns = store.get('conversation', []);
getMarketData();
if (hasNativeRadar()) {
  let actif = false;
  try { actif = typeof P.isRadarRunning === 'function' ? String(P.isRadarRunning()) === 'true' : !!store.get('radarActif', false); } catch (e) { actif = !!store.get('radarActif', false); }
  S.gpsTracking = actif;
  if (actif) pushRadarConfig();
}
setTimeout(applyVoice, 800);
if (!P) { sys("Ouvre-moi depuis l'appli Poupous sur Android."); }
if (S.turns.length) { sys('Suite de notre conversation'); S.turns.slice(-6).forEach(x => addMsg(x.role === 'user' ? 'toi' : 'poupous', x.content)); }
else addMsg('poupous', "Salut ! Appuie sur le micro et parle-moi, ou écris en bas. Tu peux aussi me demander de m'améliorer.");
idle();
if (P && !brainReady()) openBrainKey(); else announce();

loadShared();
})();
</script>
