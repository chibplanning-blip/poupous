<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- POUPOUS_APP  POUPOUS_VERSION=100 -->
<title>Poupous</title>
<style>
:root{--ink:#070d1a;--panel:#0e1729;--line:#1c2a44;--text:#e6edf7;--muted:#7d8ba3;--cyan:#38d6f5;--amber:#ffb547;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 12px);box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;letter-spacing:.2em;font-size:18px}
.status{color:var(--muted);font-size:13px;margin-top:2px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;flex:none}
.orb-wrap{position:relative;height:clamp(170px,32vh,270px);flex:none}
#orb{width:100%;height:100%;display:block}
.live{position:absolute;left:0;right:0;bottom:4px;text-align:center;color:var(--cyan);font-size:15px;min-height:22px;padding:0 8px}
.log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:6px 2px 12px;overscroll-behavior:contain}
.msg{max-width:88%}
.msg .who{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.msg p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.toi{align-self:flex-end;text-align:right}
.msg.toi p{background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:18px 18px 4px 18px;text-align:left}
.msg.poupous .who{color:var(--cyan)}
.msg.sys{align-self:center;color:var(--muted);font-size:13px;text-align:center;max-width:95%}
.bar{display:flex;gap:10px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.bar input{flex:1;min-width:0;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 18px;font:inherit}
.mic{width:64px;height:64px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#8ff3ff,var(--cyan) 45%,#1289a8);color:#04202a;display:grid;place-items:center;flex:none;box-shadow:0 0 0 6px rgba(56,214,245,.12)}
.mic.on{background:radial-gradient(circle at 35% 30%,#ffe0ad,var(--amber) 50%,#c77a12);box-shadow:0 0 0 9px rgba(255,181,71,.2)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.sheet{position:fixed;inset:0;background:rgba(3,6,14,.78);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet-inner{background:var(--panel);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 24px);box-sizing:border-box;border-top:1px solid var(--line)}
.sheet h2{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin:22px 0 4px}
.row,.chip{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.chip{align-items:flex-start;font-size:15px}
.row label{flex:1}
.row select,.row input[type=range]{width:55%}
select{background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:10px;height:40px;padding:0 8px;font:inherit;max-width:60%}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--cyan)}
input[type=range]{accent-color:var(--cyan)}
.btn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;flex:none}
.btn.primary{background:var(--cyan);color:#04202a;border-color:var(--cyan);font-weight:700}
.hint{color:var(--muted);font-size:13px}
.keybox{display:flex;flex-direction:column;gap:12px}
.carte{position:relative;overflow:hidden;height:220px;border-radius:16px;border:1px solid var(--line);background:var(--ink);margin-top:10px}
.carte-in{position:absolute;width:768px;height:768px}
.pin{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--amber);border:2px solid #04202a;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.pin.moi{background:var(--cyan);width:16px;height:16px;margin:-8px 0 0 -8px}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item .txt{flex:1;font-size:16px}
.item.ok .txt{text-decoration:line-through;color:var(--muted)}
.mag{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.mag .km{color:var(--cyan);font-weight:700;white-space:nowrap}
.clip{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;flex:none}
.attach{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px}
.attach:empty{display:none}
.chipfile{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px;font-size:13px;max-width:100%}
.chipfile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.chipfile button{width:26px;height:26px;border-radius:50%;border:0;background:var(--line);color:var(--text)}
.keybox input{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--ink);color:var(--text);padding:0 14px;font:inherit}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const P = window.Poupous;
const CHAT_MODEL = 'claude-sonnet-5';
const UPGRADE_MODEL = 'claude-opus-5';
const DEFAUT = {cerveau:'gemini', vitesse:1.0, hauteur:1.0, voix:'', mainsLibres:false, personnalite:"Chaleureux, vif, avec un brin d'humour, comme JARVIS dans Iron Man, mais tu tutoies et tu restes simple."};
const S = {attachments:[], state:'chargement', turns:[], faits:[], reglages:Object.assign({}, DEFAUT), busy:false, speaking:false, lastOk:false, pendingUpgrade:null, pendingRollback:false, hfRunning:false, listening:false, stop:false};
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const clean = s => String(s).replace(/https?:\/\/\S+/g, '').replace(/[*_#`>|]/g, '').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}]/gu, '').replace(/[ \t]+/g, ' ').trim();
const STATES = {
  chargement:['#38d6f5','Démarrage…'],
  veille:['#38d6f5','Appuie sur le micro ou écris-moi'],
  ecoute:['#38d6f5',"Je t'écoute…"],
  mainslibres:['#2aa9c7','Mains libres · dis « Poupous »'],
  reflexion:['#9d8cff','Je réfléchis…'],
  parole:['#ffb547','Je parle…'],
  amelioration:['#4ee0a6','Je modifie mon code…'],
  attente:['#ffb547','J\u2019attends ta validation'],
  erreur:['#ff6b6b','Un souci est survenu']
};
const MIC = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const CLIP = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 11.5l-8.5 8.5a5 5 0 0 1-7-7L14 4.5a3.3 3.3 0 0 1 4.7 4.7L10.2 17.7a1.7 1.7 0 0 1-2.4-2.4L15.5 7.6"/></svg>';
const CART = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 10.2a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.5L20.5 7H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>';
const GEAR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>';

/* ---------- Pont avec l'appli Android ---------- */
let seq = 0;
const pend = {};
function waitFor(prefix, start){ return new Promise(res => { const id = prefix + (++seq); pend[id] = res; start(id); }); }
function settle(id, value){ const f = pend[id]; delete pend[id]; if (f) f(value); }
window.__claudeDone = (id, status, text) => settle(id, {status, text});
window.__ttsDone = id => settle(id, true);
window.__listenDone = (id, text, err) => settle(id, {text, err});
window.__listenPartial = t => { $('#live').textContent = t; };
window.__listenReady = () => {};
window.__contactsDone = (id, json) => settle(id, json);
window.__posDone = (id, json) => settle(id, json);
window.__githubDone = (id, status, text) => settle(id, {status, text});
window.__installDone = (id, result) => settle(id, result);
window.__sharedAvailable = () => loadShared();
const hasFiles = () => !!(P && typeof P.saveFile === 'function');
const hasPhone = () => !!(P && typeof P.dial === 'function');
const NEED_APK = "Cette action demande une version plus récente de l\u2019application Poupous. Demande-la à Claude.";
const OLD_APK = "Cette action demande la nouvelle version de l'APK Poupous : installe-la depuis la page Releases du dépôt GitHub.";
window.__onBack = () => { if (S.confirmReject) { S.confirmReject(false); } else if (!$('#sheet').hidden) { $('#sheet').hidden = true; } else if (S.speaking) { stopSpeaking(); } else if (P) { P.quit(); } };
const store = {
  get(k, d){ try { const v = P ? P.get(k) : ''; return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v){ try { if (P) P.set(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- Interface ---------- */
$('#app').innerHTML =
  '<header><div><div class="brand">POUPOUS</div><div class="status" id="status"></div></div>' +
  '<div style="display:flex;gap:10px"><button class="icon-btn" id="open-courses" aria-label="Courses">' + CART + '</button>' +
  '<button class="icon-btn" id="open-settings" aria-label="Réglages">' + GEAR + '</button></div></header>' +
  '<div class="orb-wrap"><canvas id="orb" aria-hidden="true"></canvas><div class="live" id="live"></div></div>' +
  '<div class="log" id="log" aria-live="polite"></div>' +
  '<div class="attach" id="attach"></div>' +
  '<div class="bar"><button class="clip" id="clip" aria-label="Joindre un fichier">' + CLIP + '</button><input type="file" id="fichier" multiple hidden>' +
  '<input id="texte" placeholder="Écris à Poupous…" autocomplete="off" enterkeyhint="send" aria-label="Message">' +
  '<button class="mic" id="mic" aria-label="Parler à Poupous">' + MIC + '</button></div>' +
  '<div class="sheet" id="sheet" hidden><div class="sheet-inner" id="sheet-inner" role="dialog"></div></div>';

function setState(s){ S.state = s; $('#status').textContent = STATES[s][1]; }
function idle(){ setState(S.reglages.mainsLibres ? 'mainslibres' : 'veille'); }
function scrollLog(){ const l = $('#log'); l.scrollTop = l.scrollHeight; }
function addMsg(who, text){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  if (who !== 'sys') { const w = document.createElement('div'); w.className = 'who'; w.textContent = who === 'toi' ? 'Toi' : 'Poupous'; d.appendChild(w); }
  const p = document.createElement('p'); p.textContent = text; d.appendChild(p);
  $('#log').appendChild(d); scrollLog();
  return p;
}
const sys = t => addMsg('sys', t);

/* ---------- Orbe animée ---------- */
const cv = $('#orb'), g2 = cv.getContext('2d');
let t = 0;
function rgba(h, a){ const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
function draw(){
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  g2.setTransform(dpr, 0, 0, dpr, 0, 0); g2.clearRect(0, 0, w, h);
  const col = STATES[S.state][0];
  const sp = {parole:3.2, ecoute:2, reflexion:1.4, amelioration:1.6, mainslibres:.7, veille:.6, chargement:1, erreur:.4}[S.state] || 1;
  t += 0.016 * sp;
  const X = w / 2, Y = h / 2 - 10, R = Math.min(w, h) * .2, p = (Math.sin(t * 3) + 1) / 2, TAU = Math.PI * 2;
  const glow = g2.createRadialGradient(X, Y, R * .2, X, Y, R * 2.6); glow.addColorStop(0, rgba(col, .32)); glow.addColorStop(1, rgba(col, 0));
  g2.fillStyle = glow; g2.beginPath(); g2.arc(X, Y, R * 2.6, 0, TAU); g2.fill();
  for (let i = 1; i <= 3; i++) { g2.strokeStyle = rgba(col, .38 / i); g2.lineWidth = 1.5; g2.beginPath(); g2.arc(X, Y, R * (1.25 + i * .3) + p * 3 * i, 0, TAU); g2.stroke(); }
  if (S.state === 'reflexion' || S.state === 'amelioration' || S.state === 'chargement') {
    g2.strokeStyle = col; g2.lineWidth = 3; g2.lineCap = 'round';
    for (let k = 0; k < 3; k++) { const a = t * 2.2 + k * TAU / 3; g2.beginPath(); g2.arc(X, Y, R * 1.6, a, a + .8); g2.stroke(); }
  }
  g2.beginPath();
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    const amp = S.state === 'parole' ? R * .09 * Math.sin(a * 6 + t * 9) * (.6 + .4 * Math.sin(t * 5)) : S.state === 'ecoute' ? R * .05 * Math.sin(a * 4 + t * 6) : 0;
    const r = R + p * 3 + amp, px = X + Math.cos(a) * r, py = Y + Math.sin(a) * r;
    if (i) g2.lineTo(px, py); else g2.moveTo(px, py);
  }
  g2.closePath();
  const core = g2.createRadialGradient(X - R * .3, Y - R * .35, R * .08, X, Y, R * 1.05);
  core.addColorStop(0, '#ffffff'); core.addColorStop(.28, col); core.addColorStop(1, rgba(col, .2));
  g2.fillStyle = core; g2.fill();
  requestAnimationFrame(draw);
}

/* ---------- Voix ---------- */
function voicesFr(){ try { return P ? JSON.parse(P.voices()) : []; } catch (e) { return []; } }
function applyVoice(){ if (P) P.setVoice(+S.reglages.vitesse || 1, +S.reglages.hauteur || 1, S.reglages.voix || ''); }
async function speak(text){
  const c = clean(text);
  if (!c || !P) return;
  S.speaking = true; setState('parole');
  await waitFor('t', id => P.speak(id, c));
  S.speaking = false;
}
function stopSpeaking(){ if (P) P.stopSpeaking(); }

/* ---------- Écoute ---------- */
async function listenOnce(){
  if (!P) return {text:'', err:'unsupported'};
  S.listening = true; $('#live').textContent = '';
  const r = await waitFor('l', id => P.listen(id));
  S.listening = false; $('#live').textContent = '';
  return {text: (r.text || '').trim(), err: r.err || ''};
}
function micError(err){
  if (err === 'not-allowed') sys("Je n'ai pas accès au micro. Autorise le micro pour Poupous dans les paramètres Android, puis réessaie.");
  else if (err === 'unsupported') sys("La reconnaissance vocale n'est pas disponible sur ce téléphone. Installe ou active l'appli Google, puis réessaie.");
  else if (err && err !== 'no-speech' && err !== 'aborted') sys("Je n'ai pas bien capté (" + err + "). Réessaie.");
}
function lev(a, b){
  const m = Array.from({length: b.length + 1}, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = m[0]; m[0] = i;
    for (let j = 1; j <= b.length; j++) { const tmp = m[j]; m[j] = Math.min(m[j] + 1, m[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = tmp; }
  }
  return m[b.length];
}
function findWake(text){
  const tok = text.trim().split(/\s+/), n = tok.map(x => norm(x).replace(/[^a-z]/g, ''));
  for (let i = n.length - 1; i >= 0; i--) {
    for (const span of [2, 1]) {
      if (i + span > n.length) continue;
      const c = n.slice(i, i + span).join('');
      if (c.length < 4 || c.length > 10) continue;
      if (1 - lev(c, 'poupous') / Math.max(c.length, 7) >= 0.7) return {rest: tok.slice(i + span).join(' ').replace(/^[,.!?;:\s]+/, '')};
    }
  }
  return null;
}
async function followUps(){
  while (S.lastOk && !S.pendingUpgrade && !S.pendingRollback) {
    setState('ecoute'); $('#mic').classList.add('on');
    const r = await listenOnce(); $('#mic').classList.remove('on');
    if (r.err && r.err !== 'no-speech' && r.err !== 'aborted') { micError(r.err); break; }
    if (!r.text) break;
    await ask(r.text);
  }
}
async function micTap(){
  if (S.speaking) { stopSpeaking(); return; }
  if (S.listening) { if (P) P.stopListening(); return; }
  if (S.busy) return;
  if (S.reglages.mainsLibres && S.hfRunning) return;
  setState('ecoute'); $('#mic').classList.add('on');
  const r = await listenOnce(); $('#mic').classList.remove('on');
  if (r.err && r.err !== 'no-speech' && r.err !== 'aborted') { micError(r.err); idle(); return; }
  if (!r.text) { idle(); return; }
  await ask(r.text);
  await followUps();
  if (!S.busy) idle();
}
async function handsFree(){
  if (S.hfRunning) return; S.hfRunning = true;
  while (S.reglages.mainsLibres) {
    if (S.busy || S.speaking || S.listening || !$('#sheet').hidden) { await sleep(400); continue; }
    setState('mainslibres');
    const r = await listenOnce();
    if (!S.reglages.mainsLibres) break;
    if (r.err === 'not-allowed' || r.err === 'unsupported') { micError(r.err); S.reglages.mainsLibres = false; store.set('reglages', S.reglages); break; }
    if (r.err && r.err !== 'no-speech' && r.err !== 'aborted') { await sleep(1500); continue; }
    if (!r.text) continue;
    const w = findWake(r.text); if (!w) continue;
    if (/\p{L}{2,}/u.test(w.rest)) await ask(w.rest);
    else { await speak('Oui ?'); setState('ecoute'); const q = await listenOnce(); if (q.text) await ask(q.text); }
    await followUps();
  }
  S.hfRunning = false;
  if (!S.busy) idle();
}

/* ---------- Cerveau (Claude) ---------- */
function systemPrompt(){
  const d = new Date();
  const date = d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const heure = d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  return "Tu es Poupous, l'assistant vocal personnel de l'utilisateur, dans une appli Android sur son téléphone. Personnalité : " + S.reglages.personnalite + "\n" +
    "Nous sommes le " + date + ", il est " + heure + ".\n" +
    "Tes réponses sont lues à voix haute : français oral et naturel, sans markdown, sans listes, sans emojis. Une à trois phrases, sauf si on te demande des détails.\n" +
    "Outils : retenir (retiens de toi-même les informations durables que l'utilisateur partage, et tout ce qu'il demande de retenir) ; oublier ; changer_reglage ; " +
    "ameliorer_mon_code : tu peux VRAIMENT modifier ton propre programme (interface, fonctionnalités, comportement) quand l'utilisateur le demande. Ne dis jamais que c'est impossible. Si la demande est floue, pose d'abord une courte question, puis donne à l'outil une demande détaillée. " +
    "annuler_derniere_amelioration : revenir à la version précédente.\n" +
    "Actions sur le téléphone : chercher_contact (toujours avant d'appeler ou d'écrire à quelqu'un par son nom ; si plusieurs contacts correspondent, demande lequel), appeler (ouvre le téléphone avec le numéro, l'utilisateur appuie sur Appeler), envoyer_sms (ouvre la messagerie avec le texte prêt, l'utilisateur appuie sur Envoyer), mettre_reveil, minuteur, ouvrir_appli, itineraire (Google Maps), preparer_mail (ouvre l'appli mail avec le mail prêt, l'utilisateur appuie sur Envoyer). Pour un SMS ou un mail, rédige un texte naturel à partir de ce que l'utilisateur veut dire. Dis simplement ce que tu as préparé.\n" +
    "Position : l'outil ma_position te donne sa rue et sa ville. Utilise-le dès qu'il demande où il est ; ne réponds jamais que tu n'as pas accès au GPS sans l'avoir appelé.\n" +
    "ANTI-BOUCLE : une capacité du téléphone qui manque (GPS, capteurs, arrière-plan, notifications, autorisations Android) ne s'ajoute JAMAIS avec ameliorer_mon_code — la page n'y a pas accès, la réécrire ne changera rien. Tu ne modifies plus l'application Android toi-même : dans ce cas, dis-le simplement une fois et invite l'utilisateur à en parler à Claude, qui prépare le fichier. N'y reviens pas et continue avec ce que tu sais faire.\n" +
    "Ne propose jamais deux modifications de suite pour la même demande. Si une modification a échoué, explique l'échec et attends que l'utilisateur décide.\n" +
    "Courses : l'utilisateur a un mode Courses (icône panier en haut de l'écran) avec sa liste et la carte des magasins autour. Outils : courses_ajouter, courses_liste, courses_cocher, courses_vider, magasins_proches (position GPS, ou une adresse s'il la donne ; donne les distances en kilomètres, il est le plus souvent en voiture).\n" +

  if (S.lastOk) { S.turns.push({role:'assistant', content:answer}); S.turns = S.turns.slice(-20); store.set('conversation', S.turns); }
  await speak(answer);
  S.busy = false;
  if (S.pendingUpgrade) { const d = S.pendingUpgrade; S.pendingUpgrade = null; await runUpgrade(d); }
  else if (S.pendingRollback) { S.pendingRollback = false; rollback(); }

}

const RAYONS = [[1000,'1 km'],[3000,'3 km'],[10000,'10 km'],[25000,'25 km']];
const MAG = {shop:['supermarket','convenience','grocery','greengrocer','butcher','bakery']};
function liste(){ return store.get('courses', []); }
function setListe(l){ store.set('courses', l); return l; }
function coursesAjouter(txt){
  const l = liste();
  String(txt).split(/[,;\n]|\bet\b/i).map(x => x.trim().replace(/^[-•\s]+/, '')).filter(x => x && x.length < 60)
    .forEach(a => { if (!l.some(i => norm(i.t) === norm(a))) l.push({t:a, ok:false}); });
  return setListe(l);
}
function coursesCocher(txt){
  const l = liste(); let n = 0;
  l.forEach(i => { if (!i.ok && norm(i.t).includes(norm(txt))) { i.ok = true; n++; } });
  setListe(l); return n;
}
function distKm(a, b, c, d){
  const R = 6371, r = x => x * Math.PI / 180;
  const dl = r(c - a), dn = r(d - b);
  const h = Math.sin(dl/2)*Math.sin(dl/2) + Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)*Math.sin(dn/2);
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtKm(k){ return k < 1 ? Math.round(k * 1000) + ' m' : k.toFixed(k < 10 ? 1 : 0) + ' km'; }
function position(){
  if (P && typeof P.position === 'function') {
    return waitFor('p', id => P.position(id)).then(r => {
      let o = null; try { o = JSON.parse(r); } catch (e) {}
      if (!o || o.erreur || typeof o.lat !== 'number') throw new Error(o && o.erreur ? o.erreur : 'position introuvable');
      const v = {lat:o.lat, lon:o.lon, vit:o.vitesse};
      store.set('dernierePos', v);
      return v;
    });
  }
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error("ce téléphone ne me donne pas la position"));
    navigator.geolocation.getCurrentPosition(
      p => { const o = {lat:p.coords.latitude, lon:p.coords.longitude, vit:p.coords.speed}; store.set('dernierePos', o); res(o); },
      e => rej(new Error(e && e.code === 1 ? "l'application ne me donne pas encore la position GPS" : "position introuvable")),
      {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
  });
}
async function geocode(q){
  const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
  if (!r.ok) throw new Error('recherche d adresse indisponible');
  const j = await r.json();
  if (!j.length) throw new Error('adresse introuvable');
  return {lat:parseFloat(j[0].lat), lon:parseFloat(j[0].lon)};
}
async function magasins(lat, lon, rayon){
  const f = '"shop"~"^(' + MAG.shop.join('|') + ')$"';
  const q = '[out:json][timeout:25];(node[' + f + '](around:' + rayon + ',' + lat + ',' + lon + ');way[' + f + '](around:' + rayon + ',' + lat + ',' + lon + '););out center 60;';
  const r = await fetch('https://overpass-api.de/api/interpreter', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'data=' + encodeURIComponent(q)});
  if (!r.ok) throw new Error('service des magasins indisponible (' + r.status + ')');
  const j = await r.json();
  return (j.elements || []).map(e => {
    const la = e.lat != null ? e.lat : (e.center && e.center.lat);
    const lo = e.lon != null ? e.lon : (e.center && e.center.lon);
    if (la == null || lo == null) return null;
    const t = e.tags || {};
    return {nom:t.name || 'Magasin', type:t.shop || '', lat:la, lon:lo, km:distKm(lat, lon, la, lo),
            adr:[t['addr:housenumber'], t['addr:street'], t['addr:city']].filter(Boolean).join(' ')};
  }).filter(Boolean).sort((a, b) => a.km - b.km).slice(0, 15);
}
function carteHTML(lat, lon, pts){
  const z = 14, n = Math.pow(2, z), W = 256;
  const xy = (la, lo) => {
    const r = la * Math.PI / 180;
    return {x:(lo + 180) / 360 * n, y:(1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n};
  };
  const c = xy(lat, lon), x0 = Math.floor(c.x), y0 = Math.floor(c.y);
  let h = '';
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
    h += '<img src="https://tile.openstreetmap.org/' + z + '/' + (x0 + dx) + '/' + (y0 + dy) + '.png" width="256" height="256" style="position:absolute;left:' + ((dx + 1) * W) + 'px;top:' + ((dy + 1) * W) + 'px" alt="">';
  const px = (la, lo) => { const q = xy(la, lo); return {l:(q.x - x0 + 1) * W, t:(q.y - y0 + 1) * W}; };
  const me = px(lat, lon);
  h += '<div class="pin moi" style="left:' + me.l.toFixed(0) + 'px;top:' + me.t.toFixed(0) + 'px"></div>';
  pts.slice(0, 12).forEach(p => { const q = px(p.lat, p.lon); h += '<div class="pin" style="left:' + q.l.toFixed(0) + 'px;top:' + q.t.toFixed(0) + 'px"></div>'; });
  return '<div class="carte"><div class="carte-in" style="left:calc(50% - ' + me.l.toFixed(0) + 'px);top:calc(50% - ' + me.t.toFixed(0) + 'px)">' + h + '</div></div>' +
    '<p class="hint">Carte © OpenStreetMap</p>';
}

async function chercherMagasins(adresse){

const MOTS_NATIFS = /\b(gps|g[ée]olocalisation|localisation|position|coordonn[ée]es|capteur|bluetooth|nfc|appareil photo|cam[ée]ra|notification|arri[èe]re[- ]plan|[ée]cran [ée]teint|autorisation android|permission android|service android)\b/i;
async function runUpgrade(demande){

    return upgradeFail("Ça, c'est une fonction du téléphone : ma page ne peut pas y toucher, seule mon application Android le peut. Utilise « Modifier l'APK » plutôt que « Modifier la page ». Je n'ai rien changé.");
  }

  const source = P.getApp();
  if (!source) return upgradeFail("Je n'arrive pas à lire mon propre code.");
  const version = (source.match(/POUPOUS_VERSION\s*=\s*(\d+)/) || [])[1] || '1';
  const rules = "Tu es un développeur web expert. Tu fais évoluer Poupous, un assistant vocal en français : un fichier HTML unique (CSS et JavaScript intégrés, sans framework ni ressource externe) affiché dans la WebView d'une appli Android.\n" +

    "Contraintes impératives :\n" +

    "- Garde exactement le commentaire POUPOUS_APP POUPOUS_VERSION=" + version + " dans le head.\n" +

    "- Tu ne peux pas ajouter de capacité du téléphone (GPS, capteurs, arrière-plan, autorisations Android) : ça se passe dans l'application Android, pas dans cette page.\n" +
    "- SÉCURITÉ INTOUCHABLE : garde la fonction confirmChange et son appel dans runUpgrade, la fonction renderSettings et l'objet DEFAUT, ainsi que dans les réglages le bouton #open-settings, la section Personnalité avec #perso-reset, la liste des souvenirs avec data-del, et le bouton #hard-reset. L'utilisateur doit toujours pouvoir valider ou refuser une modification et tout remettre à zéro.\n" +
    "- Aucune ressource externe (pas de CDN, pas de police en ligne).\n" +
    "- Change seulement ce qui est demandé ; garde tout le reste fonctionnel et en français.\n" +
    "Format de réponse exact : une ligne " + MK('RESUME') + ", une phrase en français résumant le changement, une ligne " + MK('HTML') + ", le fichier complet, une ligne " + MK('FIN') + ". Pas de markdown.";
  let out = '';
  try {
    const res = await complete(rules, "DEMANDE DE L'UTILISATEUR :\n" + demande + "\n\nFICHIER ACTUEL :\n" + source, 32000);
    if (res.truncated) return upgradeFail("Le nouveau code était trop long et a été coupé. Je n'ai rien changé.");
    out = res.text;
  } catch (e) { return upgradeFail(errCopy(e) + " Je n'ai rien changé."); }
  const iR = out.indexOf(MK('RESUME')), iH = out.indexOf(MK('HTML')), iF = out.lastIndexOf(MK('FIN'));
  if (iH < 0 || iF < iH) return upgradeFail("Je n'ai pas reçu un code complet. Je n'ai rien changé.");
  const resume = (iR >= 0 && iR < iH ? out.slice(iR + MK('RESUME').length, iH) : demande).trim().slice(0, 300);
  const html = out.slice(iH + MK('HTML').length, iF).replace(/^\s*```\w*\s*|\s*```\s*$/g, '').trim();
  for (const k of ['POUPOUS_APP', 'ameliorer_mon_code', 'annuler_derniere_amelioration', '__poupousOK', 'saveApp', 'confirmChange', 'renderSettings', 'open-settings', 'perso-reset', 'hard-reset', 'data-del', 'DEFAUT', 'renderCourses', 'open-courses']) {
    if (!html.includes(k)) return upgradeFail("Le nouveau code perdait une partie essentielle (" + k + "). Je n'ai rien changé.");
  }
  const scripts = [...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m => m[1]);
  for (const s of scripts) { try { new Function(s); } catch (e) { if (e instanceof SyntaxError) return upgradeFail("Le nouveau code contient une erreur : " + e.message + ". Je n'ai rien changé."); } }

  const r = P.saveApp(finalHtml);
  if (r !== 'ok') { store.set('maj', null); upgradeFail("L'enregistrement a échoué (" + r + ")."); }

async function rollback(){
  S.busy = true; setState('amelioration');

      : '<p class="hint">Rien pour l\'instant. Dis par exemple « retiens que je bois mon café noir ».</p>') +
    '<h2>Cerveau</h2>' +
    '<div class="row"><label for="cerveau">Modèle</label><select id="cerveau"><option value="gemini"' + (provider() === 'gemini' ? ' selected' : '') + '>Gemini (gratuit)</option><option value="claude"' + (provider() === 'claude' ? ' selected' : '') + '>Claude (payant)</option></select></div>' +
    '<div class="row"><span>Clé Gemini : ' + (geminiKey() ? 'enregistrée' : 'aucune') + '</span><button class="btn" id="change-gem">' + (geminiKey() ? 'Changer' : 'Ajouter') + '</button></div>' +
    '<div class="row"><span>Clé Claude : ' + (P && P.hasKey() ? 'enregistrée' : 'aucune') + '</span><button class="btn" id="change-key">' + (P && P.hasKey() ? 'Changer' : 'Ajouter') + '</button></div>' +
    '<h2>Personnalité</h2>' +
    '<textarea id="perso" rows="3" style="width:100%;box-sizing:border-box;border-radius:14px;border:1px solid var(--line);background:var(--ink);color:var(--text);padding:10px 14px;font:inherit">' + esc(r.personnalite) + '</textarea>' +
    '<div class="row"><button class="btn" id="perso-reset">Remettre par défaut</button><button class="btn primary" id="perso-save">Enregistrer</button></div>' +
    '<h2>Améliorer Poupous</h2>' +
    '<p class="hint">Décris le changement voulu. Poupous te montrera ce qu\'il compte faire avant d\'appliquer.</p>' +
    '<input id="amelio" class="bar-input" style="width:100%;box-sizing:border-box;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--ink);color:var(--text);padding:0 14px;font:inherit" placeholder="Ex. : écouter « Poupous » même appli fermée">' +
    '<div class="row"><button class="btn primary" id="go-page">Demander ce changement</button></div>' +
    '<h2>Versions</h2>' +
    '<p class="hint">Page : version ' + (P ? P.appVersion() : '?') + ' · Application Android : ' + (P && typeof P.nativeVersion === 'function' ? '1.' + (P.nativeVersion() - 1) : '1.0') + '</p>' +
    '<div class="row"><span>Version précédente</span><button class="btn" id="undo">Restaurer</button></div>' +
    '<div class="row"><span>Historique de conversation</span><button class="btn" id="clear-conv">Effacer</button></div>' +
    '<div class="row"><span>Tout remettre à zéro<br><span class="hint">Personnalité, souvenirs et historique</span></span><button class="btn" id="hard-reset">Réinitialiser</button></div>';
  $('#close-settings').onclick = () => { $('#sheet').hidden = true; };
  $('#hf').onchange = e => { setReglage('mainsLibres', String(e.target.checked)); if (!S.busy) idle(); };
  $('#voix').onchange = e => { S.reglages.voix = e.target.value; applyVoice(); store.set('reglages', S.reglages); };
  $('#vitesse').onchange = e => setReglage('vitesse', e.target.value);
  $('#hauteur').onchange = e => setReglage('hauteur', e.target.value);
  $('#test-voix').onclick = () => speak("Salut, c'est Poupous. Voilà ma voix.").then(() => { if (!S.busy) idle(); });
  $('#change-key').onclick = openKey;
  $('#perso-save').onclick = () => { S.reglages.personnalite = $('#perso').value.trim().slice(0, 600) || DEFAUT.personnalite; store.set('reglages', S.reglages); sys('Personnalité mise à jour.'); };
  $('#perso-reset').onclick = () => { S.reglages.personnalite = DEFAUT.personnalite; store.set('reglages', S.reglages); renderSettings(); sys('Personnalité remise par défaut.'); };
  $('#go-page').onclick = () => { const d = $('#amelio').value.trim(); if (d.length < 3 || S.busy) return; $('#sheet').hidden = true; ask('PAGE: ' + d); };
  $('#change-gem').onclick = openGeminiKey;
  $('#cerveau').onchange = e => { S.reglages.cerveau = e.target.value; store.set('reglages', S.reglages); renderSettings(); if (!brainReady()) openBrainKey(); };
  $('#sheet-inner').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.faits.splice(+b.dataset.del, 1); store.set('memoire', S.faits); renderSettings(); });
  $('#undo').onclick = () => { $('#sheet').hidden = true; if (!S.busy) rollback(); };
  $('#clear-conv').onclick = () => { S.turns = []; store.set('conversation', []); $('#log').innerHTML = ''; sys('Historique effacé.'); };
  $('#hard-reset').onclick = () => {
    S.reglages.personnalite = DEFAUT.personnalite; store.set('reglages', S.reglages);
    S.faits = []; store.set('memoire', []);
    S.turns = []; store.set('conversation', []); $('#log').innerHTML = '';
    $('#sheet').hidden = true;
    sys('Poupous remis à zéro : personnalité par défaut, souvenirs et historique effacés.');
  };
}

/* ---------- Démarrage ---------- */
$('#mic').onclick = micTap;
$('#clip').onclick = () => $('#fichier').click();
$('#fichier').onchange = e => {
  for (const f of Array.from(e.target.files || [])) {
    if (f.size > 10 * 1024 * 1024) { sys('« ' + f.name + ' » est trop gros (10 Mo maximum).'); continue; }
    const rd = new FileReader();
    rd.onload = () => { const s = String(rd.result); addAttachment(f.name, f.type, s.slice(s.indexOf(',') + 1)); };
    rd.readAsDataURL(f);
  }
  e.target.value = '';
};
$('#texte').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = e.target.value.trim() || (S.attachments.length ? 'Voici un fichier.' : ''); if (v && !S.busy) { e.target.value = ''; e.target.blur(); stopSpeaking(); ask(v).then(() => { if (!S.busy) idle(); }); } } });
$('#open-settings').onclick = () => { renderSettings(); $('#sheet').hidden = false; };
$('#open-courses').onclick = () => { renderCourses(); $('#sheet').hidden = false; };
$('#sheet').onclick = e => { if (e.target.id !== 'sheet') return; if (S.confirmReject) { S.confirmReject(false); return; } $('#sheet').hidden = true; };
setState('chargement');
requestAnimationFrame(draw);
window.__poupousOK = true;

S.faits = store.get('memoire', []);
Object.assign(S.reglages, store.get('reglages', {}));
S.turns = store.get('conversation', []);
setTimeout(applyVoice, 800);
if (!P) { sys("Ouvre-moi depuis l'appli Poupous sur Android."); }
if (S.turns.length) { sys('Suite de notre conversation'); S.turns.slice(-6).forEach(x => addMsg(x.role === 'user' ? 'toi' : 'poupous', x.content)); }
else addMsg('poupous', "Salut ! Appuie sur le micro et parle-moi, ou \u00e9cris en bas. Tu peux aussi me demander de m'am\u00e9liorer.");
idle();
if (P && !brainReady()) openBrainKey(); else announce();
if (S.reglages.mainsLibres) handsFree();
loadShared();
})();
</script>
</body>
</html>
